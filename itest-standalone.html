d #e8ebef;\n}\n.overlay-gridline {\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  background: #edf0f3;\n}\n.overlay-idle {\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 57px;\n  height: 2px;\n  background: #d5dbe3;\n}\n.overlay-now {\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  width: 2px;\n  background: #df3f47;\n  z-index: 8;\n}\n.overlay-now:before {\n  content: \"现在\";\n  position: absolute;\n  top: 2px;\n  left: 4px;\n  color: #d53a42;\n  font-size: 9px;\n  white-space: nowrap;\n  background: rgba(255, 255, 255, 0.9);\n  padding: 1px 3px;\n  border-radius: 3px;\n}\n.overlay-machine-row + .overlay-machine-row .overlay-now:before {\n  content: none;\n}\n.overlay-plan {\n  position: absolute;\n  top: 6px;\n  height: 32px;\n  border: 1px solid #8da4cf;\n  border-radius: 4px;\n  background: #eef3fb;\n  color: #405a88;\n  z-index: 1;\n  overflow: hidden;\n  cursor: pointer;\n}\n.overlay-plan-name {\n  position: absolute;\n  left: 6px;\n  right: 5px;\n  top: 3px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  font-size: 9px;\n  font-weight: 700;\n}\n.overlay-plan-time {\n  position: absolute;\n  left: 6px;\n  right: 4px;\n  top: 16px;\n  font:\n    8px \"SFMono-Regular\",\n    Consolas,\n    monospace;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.overlay-actual {\n  position: absolute;\n  top: 48px;\n  height: 16px;\n  border-radius: 3px;\n  z-index: 3;\n  cursor: pointer;\n  min-width: 3px;\n}\n.overlay-actual.run {\n  background: #087bc1;\n}\n.overlay-actual.pending {\n  background: #d8992f;\n}\n.overlay-actual:hover {\n  filter: brightness(0.9);\n  z-index: 5;\n}\n.overlay-actual span {\n  position: absolute;\n  left: 5px;\n  right: 3px;\n  top: 1px;\n  color: #fff;\n  font:\n    8px/14px \"SFMono-Regular\",\n    Consolas,\n    monospace;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.overlay-actual.pending span {\n  color: #3d2908;\n}\n.overlay-plan.filtered,\n.overlay-actual.filtered {\n  opacity: 0.25;\n}\n.overlay-machine-row:not(.unavailable) .overlay-plan.task-done {\n  background: #e7f5ed;\n  border-color: #75b993;\n  color: #226a46;\n}\n.overlay-machine-row:not(.unavailable) .overlay-plan.task-running {\n  background: #e6f2fb;\n  border-color: #61a7d3;\n  color: #075f99;\n}\n.overlay-machine-row:not(.unavailable) .overlay-actual.run.task-done {\n  background: #278867;\n}\n.overlay-machine-row:not(.unavailable) .overlay-actual.run.task-running {\n  background: #087bc1;\n}\n.overlay-machine-row.unavailable,\n.overlay-machine-row.unavailable .overlay-machine-cell,\n.overlay-machine-row.unavailable .overlay-track {\n  background: #f1f3f5;\n}\n.overlay-machine-row.unavailable .overlay-machine-cell {\n  color: #697386;\n}\n.overlay-machine-row.unavailable .overlay-plan {\n  background: #e1e5ea;\n  border-color: #aab2bd;\n  color: #68717f;\n}\n.overlay-machine-row.unavailable .overlay-actual.pending {\n  background: #aeb6c2;\n}\n.overlay-machine-row.unavailable .overlay-idle {\n  display: none;\n}\n.overlay-help {\n  padding: 8px 12px;\n  border-top: 1px solid var(--border);\n  background: #fafbfc;\n  color: #667085;\n  font-size: 10px;\n}\n.machine-list {\n  display: block;\n}\n.machine-stats .stat {\n  width: 100%;\n  color: var(--text);\n  text-align: left;\n  font: inherit;\n}\n.machine-stats .stat[data-filter=\"all\"] .stat-dot {\n  background: var(--gray);\n}\n.machine-stats .stat[data-filter=\"idle\"] .stat-dot {\n  background: var(--green);\n}\n.machine-stats .stat[data-filter=\"running\"] .stat-dot {\n  background: var(--blue);\n}\n.machine-stats .stat[data-filter=\"down\"] .stat-dot {\n  background: var(--red);\n}\n.lab-section + .lab-section {\n  margin-top: 28px;\n  padding-top: 24px;\n  border-top: 1px solid var(--border);\n}\n.lab-section-head,\n.model-section-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n.lab-section-head {\n  margin-bottom: 1 button id=\"prev\">\u003c/button>\u003cstrong id=\"date-label\">\u003c/strong\n            >\u003cbutton id=\"next\">\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"seg\" id=\"shift-seg\">\n            \u003cbutton data-shift=\"all\" class=\"active\">全天\u003c/button\n            >\u003cbutton data-shift=\"day\">白班\u003c/button\n            >\u003cbutton data-shift=\"night\">夜班\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"seg\" id=\"scope-seg\">\n            \u003cbutton data-scope=\"mine\">我的\u003c/button\n            >\u003cbutton data-scope=\"dept\">本部门\u003c/button\n            >\u003cbutton data-scope=\"all\">全部\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"toolbar-spacer\">\u003c/div>\n          \u003cselect class=\"select\" id=\"status-filter\">\n            \u003coption value=\"\">全部状态\u003c/option>\n            \u003coption value=\"scheduled\">已排程\u003c/option>\n            \u003coption value=\"running\">测试中\u003c/option>\n            \u003coption value=\"pending\">待排程\u003c/option>\n            \u003coption value=\"done\">已完成\u003c/option>\u003c/select\n          >\u003cinput\n            class=\"search\"\n            id=\"search\"\n            placeholder=\"搜索工单号、产品、申请人\"\n          />\n        \u003c/div>\n        \u003cdiv class=\"view-tabs\" id=\"view-tabs\">\n          \u003cbutton data-view=\"gantt\" class=\"active\">排测对比\u003c/button\n          >\u003cbutton data-view=\"list\">工单列表\u003c/button>\n          \u003cdiv class=\"overlay-legend\">\n            \u003cspan>\u003ci class=\"plan\">\u003c/i>预测\u003c/span\n            >\u003cspan>\u003ci class=\"run\">\u003c/i>run\u003c/span\n            >\u003cspan>\u003ci class=\"pending\">\u003c/i>pending\u003c/span\n            >\u003cspan>\u003ci class=\"idle\">\u003c/i>idle\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"gantt-view\">\u003c/div>\n        \u003cdiv id=\"list-view\" class=\"hidden\">\u003c/div>\n        \u003cdiv id=\"exec-view\" class=\"hidden\">\u003c/div>\n      \u003c/section>\n    \u003c/main>\n    \u003cscript>/* ============================================================\n   iTest 智能排测系统 — shared mock data + state layer\n   Persisted to localStorage so edits flow across pages.\n   Time model: timeline offset 0 = 08:00; 1440 min span = 08:00→next 08:00\n     Day shift   白班 : offset    0 – 720   (08:00 – 20:00)\n     Night shift 夜班 : offset  720 – 1440  (20:00 – 08:00)\n   ============================================================ */\n(function (global) {\n  const KEY = 'itest-state-v7';\n\n  // simulated \"current time\": 14:40 → day shift in progress\n  const NOW_MIN = 400;\n\n  // 中国大陆法定节假日日历（2026，自动同步，无需人工维护）\n  const CN_HOLIDAYS = [\n    '2026-01-01',                                                                                       // 元旦\n    '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22',         // 春节\n    '2026-04-04','2026-04-05','2026-04-06',                                                             // 清明\n    '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',                                   // 劳动节\n    '2026-06-19','2026-06-20','2026-06-21',                                                             // 端午\n    '2026-09-25','2026-09-26','2026-09-27',                                                             // 中秋\n    '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08', // 国庆\n  ];\n  // 调休上班日（落在周末但需上班）\n  const CN_MAKEUP_WORKDAYS = ['2026-02-14', '2026-02-15', '2026-04-26', '2026-10-10'];\n\n  const SEED = {\n    nowMin: NOW_MIN,\n    today: '2026-06-10',\n    meta: {\n      // PE manager: one priority bump per day, for a single task\n      managerAdjustUsed: false,\n      managerAdjustTask: null,\n      noShowToday: 1,          // 白班未签到被自动释放次数（恶性占机治理埋点）\n      autoReleased: ['T-1009'],\n    },\n    // 部门：优先级(rank 越小越高) + 每日白班机时配额(分钟，仅白天计)\n    departments: [\n      { name: '研发一部', rank: 1, dailyQuotaMin: 600 },\n      { name: '研发二部', rank: 2, dailyQuotaMin: 480 },\n      { name: '研发三部', rank: 3, dailyQuotaMin: 360 },\n    ],\n    config: { checkinGraceMin: 15, leadDays: 3 },   // 签到宽限期 / 预约提前量(当天~T+3)\n    // 借机规则：周一至周五 × 机台 的「优先预约部门」单元格（Lab 维护，不定期更新）\n    // 每条 = 一个 (机台, 星期) 单元格，depts 为该格拥有优先权的部门集合（可多个共享）。\n    borrowRules: [\n      { id: 'BR-1',  machine: 'ICT-A',   weekday: '周一', depts: ['研发一部'],          note: '主板 ICT 量产优先窗口' },\n      { id: 'BR-2',  machine: 'ICT-A',   weekday: '周二', depts: ['研发一部','研发二部'], note: '两部门共享，按部门优先级排队' },\n      { id: 'BR-3',  machine: 'ICT-A',   weekday: '周三', depts: ['研发二部'],          note: '' },\n      { id: 'BR-4',  machine: 'ICT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-5',  machine: 'ICT-A',   weekday: '周五', depts: ['研发三部'],          note: '周末前补测' },\n      { id: 'BR-6',  machine: 'ICT-B',   weekday: '周一', depts: ['研发一部'],          note: '' },\n      { id: 'BR-7',  machine: 'ICT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-8',  machine: 'ICT-B',   weekday: '周三', depts: ['研发一部','研发三部'], note: '' },\n      { id: 'BR-9',  machine: 'ICT-B',   weekday: '周五', depts: ['研发一部'],          note: '' },\n      { id: 'BR-10', machine: 'FCT-A',   weekday: '周一', depts: ['研发一部','研发三部'], note: '共享窗口' },\n      { id: 'BR-11', machine: 'FCT-A',   weekday: '周二', depts: ['研发三部'],          note: '整机功能测试' },\n      { id: 'BR-12', machine: 'FCT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-13', machine: 'FCT-A',   weekday: '周五', depts: ['研发二部'],          note: '' },\n      { id: 'BR-14', machine: 'FCT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-15', machine: 'RF-01',   weekday: '周一', depts: ['研发三部'],          note: '周一上午校准，期间不可约' },\n      { id: 'BR-16', machine: 'RF-01',   weekday: '周二', depts: ['研发三部'],          note: '' },\n      { id: 'BR-17', machine: 'RF-01',   weekday: '周三', depts: ['研发一部','研发二部','研发三部'], note: '射频公共窗口，三部门共享' },\n      { id: 'BR-18', machine: 'RF-01',   weekday: '周四', depts: ['研发一部'],          note: '' },\n      { id: 'BR-19', machine: 'BURN-01', weekday: '周一', depts: ['研发二部'],          note: '' },\n      { id: 'BR-20', machine: 'BURN-01', weekday: '周四', depts: ['研发一部'],          note: '老化测试排程' },\n      { id: 'BR-21', machine: 'BURN-01', weekday: '周五', depts: ['研发三部'],          note: '' },\n    ],\n    // 机台零部件 / 治具说明：供 PE 预约前参考（Lab 维护，不定期更新）\n    machineParts: [\n      { id: 'MP-1', machine: 'ICT-A',   part: '飞针探针卡 Probe-A',         spec: 'Apollo / Orion 主板（≤ 6 层）', note: '探针寿命约 80%，大批量测试前建议更换' },\n      { id: 'MP-2', machine: 'ICT-B',   part: '针床治具 Bed-of-Nails B2',   spec: 'Vega 子板',                    note: '仅支持 1.27mm 间距测试点' },\n      { id: 'MP-3', machine: 'FCT-A',   part: '功能夹具 FX-12 + 24V 负载',  spec: 'Nova 整机 / Orion 模组',        note: '需配 24V 电源模块' },\n      { id: 'MP-4', machine: 'FCT-B',   part: '探针更换中',                 spec: '—',                            note: '保养中，预计 18:00 恢复' },\n      { id: 'MP-5', machine: 'RF-01',   part: '射频屏蔽箱 + 矢网校准件',     spec: 'Pulsar 射频板（Sub-6GHz）',     note: '每周一上午校准，校准期间不可预约' },\n      { id: 'MP-6', machine: 'BURN-01', part: '高低温老化箱 + 温度探头 ×8', spec: 'Quasar 电源板',                 note: '压缩机故障维修中，暂停排测' },\n    ],\n    machines: [\n      { id: 'M-01', name: 'ICT-A',  type: 'ICT 在线测试',  lab: 'A区·01', status: 'idle',        owner: '—',        note: '' },\n      { id: 'M-02', name: 'ICT-B',  type: 'ICT 在线测试',  lab: 'A区·02', status: 'running',     owner: '陈明',     note: '正在执行 T-1004' },\n      { id: 'M-03', name: 'FCT-A',  type: 'FCT 功能测试',  lab: 'A区·05', status: 'running',     owner: '王伟',     note: '正在执行 T-1006' },\n      { id: 'M-04', name: 'FCT-B',  type: 'FCT 功能测试',  lab: 'A区·06', status: 'maintenance', owner: '设备组',   note: '探针更换保养，预计 18:00 恢复' },\n      { id: 'M-05', name: 'RF-01',  type: '射频测试',      lab: 'B区·11', status: 'idle',        owner: '—',        note: '' },\n      { id: 'M-06', name: 'BURN-01',type: '老化测试',      lab: 'B区·14', status: 'fault',       owner: '设备组',   note: '温箱压缩机异常，待维修，暂停排测' },\n    ],\n    tasks: [\n      // ---------- 白班 day shift ----------\n      { id: 'T-1001', shift: 'day',   machine: 'M-01', start: 0,   end: 120, status: 'done',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 120, note: '良率 99.2%，已上传报告' },\n      { id: 'T-1002', shift: 'day',   machine: 'M-01', start: 150, end: 330, status: 'done',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'mid', est: 180, note: '' },\n      { id: 'T-1003', shift: 'day',   machine: 'M-02', start: 60,  end: 240, status: 'done',\n        pe: '张涛', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'low', est: 180, note: '' },\n      { id: 'T-1004', shift: 'day',   machine: 'M-02', start: 270, end: 510, status: 'running',\n        pe: '陈明', dept: '研发二部', product: 'Apollo 主板', type: 'ICT', prio: 'high', est: 240, note: '' },\n      { id: 'T-1005', shift: 'day',   machine: 'M-03', start: 30,  end: 360, status: 'done',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'mid', est: 330, note: '' },\n      { id: 'T-1006', shift: 'day',   machine: 'M-03', start: 360, end: 600, status: 'running',\n        pe: '王伟', dept: '研发一部', product: 'Orion 模组', type: 'FCT', prio: 'high', est: 240, note: '' },\n      { id: 'T-1007', shift: 'day',   machine: 'M-05', start: 420, end: 600, status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'mid', est: 180, source: 'self', checkedIn: false, note: '' },\n      { id: 'T-1008', shift: 'day',   machine: 'M-01', start: 480, end: 600, status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 120, source: 'self', checkedIn: false, note: '白班自助预约 · 待签到（16:00）' },\n\n      // ---------- 夜班 night shift（PE 白班提交，Lab 工程师夜间执行）----------\n      { id: 'T-2001', shift: 'night', machine: 'M-01', start: 720,  end: 900,  status: 'scheduled',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'high', est: 180, note: '' },\n      { id: 'T-2002', shift: 'night', machine: 'M-01', start: 930,  end: 1110, status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 180, note: '' },\n      { id: 'T-2003', shift: 'night', machine: 'M-02', start: 750,  end: 1020, status: 'scheduled',\n        pe: '陈明', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'mid', est: 270, note: '' },\n      { id: 'T-2004', shift: 'night', machine: 'M-03', start: 780,  end: 1200, status: 'scheduled',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'high', est: 420, note: '夜间长时间老化+功能复测' },\n      { id: 'T-2005', shift: 'night', machine: 'M-05', start: 720,  end: 1140, status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'low', est: 420, note: '' },\n\n      // ---------- 待排程 pending（智能算法待规划 / 机台不可用导致挂起）----------\n      { id: 'T-2006', shift: 'night', machine: null, start: null, end: null, status: 'pending',\n        pe: '张涛', dept: '研发二部', product: 'Quasar 电源板', type: '老化', prio: 'mid', est: 360, note: 'BURN-01 故障，等待机台恢复或改派' },\n      { id: 'T-2007', shift: 'day',   machine: null, start: null, end: null, status: 'pending',\n        pe: '周琳', dept: '研发三部', product: 'Comet 传感模组', type: 'FCT', prio: 'high', est: 150, note: '今日新提交，待算法插入白班空档' },\n\n      // ---------- 明日规划 day +1（算法已提前排好）----------\n      { id: 'T-1101', day: 1, shift: 'day',   machine: 'M-01', start: 60,  end: 210,  status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 150, note: '明日首件复测' },\n      { id: 'T-1102', day: 1, shift: 'day',   machine: 'M-02', start: 30,  end: 240,  status: 'scheduled',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'high', est: 210, note: '' },\n      { id: 'T-1103', day: 1, shift: 'day',   machine: 'M-03', start: 120, end: 420,  status: 'scheduled',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'mid', est: 300, note: '' },\n      { id: 'T-1104', day: 1, shift: 'day',   machine: 'M-05', start: 300, end: 480,  status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'low', est: 180, note: '' },\n      { id: 'T-2101', day: 1, shift: 'night', machine: 'M-01', start: 720, end: 960,  status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'high', est: 240, note: '夜间老化 + 功能复测' },\n      { id: 'T-2102', day: 1, shift: 'night', machine: 'M-03', start: 780, end: 1140, status: 'scheduled',\n        pe: '陈明', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'mid', est: 360, note: '' },\n    ],\n  };\n\n  // ---- persistence ----\n  function clone(o) { return JSON.parse(JSON.stringify(o)); }\n  function load() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) return JSON.parse(raw);\n    } catch (e) {}\n    const s = clone(SEED);\n    save(s);\n    return s;\n  }\n  function save(s) {\n    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}\n  }\n  // next sequential id for an editable sheet row, e.g. rowId('BR', rules) → 'BR-5'\n  function rowId(prefix, arr) {\n    let n = 0;\n    arr.forEach(r => { const m = /(\\d+)$/.exec(r.id || ''); if (m) n = Math.max(n, +m[1]); });\n    return prefix + '-' + (n + 1);\n  }\n\n  let state = load();\n\n  // ---- helpers ----\n  function minToClock(offset) {\n    if (offset == null) return '—';\n    let total = 480 + offset;\n    const h = Math.floor(total / 60) % 24;\n    const m = total % 60;\n    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');\n  }\n  function fmtDur(min) {\n    if (min == null) return '—';\n    const h = Math.floor(min / 60), m = min % 60;\n    return (h ? h + 'h' : '') + (m ? m + 'min' : (h ? '' : '0min'));\n  }\n  // date label for a day-offset relative to the simulated \"today\" (state.today)\n  function dateLabel(offset) {\n    const base = new Date(state.today + 'T00:00:00');\n    const d = new Date(base.getTime() + offset * 86400000);\n    const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];\n    const text = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n    return { text, wd, isToday: offset === 0 };\n  }\n  function dayName(offset) {\n    return offset === 0 ? '今天' : offset === 1 ? '明天' : offset === -1 ? '昨天'\n         : (offset > 0 ? '+' + offset + '天' : offset + '天');\n  }\n\n  const STATUS_META = {\n    pending:   { label: '待排程',  cls: 'neutral' },\n    scheduled: { label: '已排程',  cls: 'info' },\n    running:   { label: '测试中',  cls: 'running' },\n    done:      { label: '已完成',  cls: 'ok' },\n    hold:      { label: '已挂起',  cls: 'warn' },\n    fail:      { label: '测试异常', cls: 'danger' },\n  };\n  const MACHINE_STATUS = {\n    idle:        { label: '空闲',   cls: 'ok',      schedulable: true  },\n    running:     { label: '运行中', cls: 'running', schedulable: true  },\n    maintenance: { label: '保养中', cls: 'warn',    schedulable: false },\n    fault:       { label: '故障',   cls: 'danger',  schedulable: false },\n  };\n  const PRIO_META = {\n    high: { label: '高', cls: 'p-high', rank: 0 },\n    mid:  { label: '中', cls: 'p-mid',  rank: 1 },\n    low:  { label: '低', cls: 'p-low',  rank: 2 },\n  };\n\n  const Store = {\n    get state() { return state; },\n    get machines() { return state.machines; },\n    get tasks() { return state.tasks; },\n    nowMin: () => state.nowMin,\n    today: () => state.today,\n\n    machine(id) { return state.machines.find(m => m.id === id); },\n    task(id) { return state.tasks.find(t => t.id === id); },\n    tasksByShift(shift) { return state.tasks.filter(t => t.shift === shift); },\n    schedulableMachines() { return state.machines.filter(m => MACHINE_STATUS[m.status].schedulable); },\n\n    setMachineStatus(id, status, note) {\n      const m = this.machine(id);\n      if (!m) return;\n      m.status = status;\n      if (note != null) m.note = note;\n      save(state);\n    },\n    setTaskStatus(id, status, note) {\n      const t = this.task(id);\n      if (!t) return;\n      t.status = status;\n      if (note != null) t.note = note;\n      save(state);\n    },\n    setTaskMachine(id, machine) {\n      const t = this.task(id);\n      if (!t) return;\n      t.machine = machine;\n      t.moved = true;\n      save(state);\n    },\n    setTaskPrio(id, prio) {\n      const t = this.task(id);\n      if (!t) return;\n      t.prio = prio;\n      save(state);\n    },\n    addTask(t) {\n      state.tasks.push(t);\n      save(state);\n    },\n    updateTask(id, fields) {\n      const t = this.task(id);\n      if (!t) return;\n      Object.assign(t, fields);\n      save(state);\n    },\n    removeTask(id) {\n      const i = state.tasks.findIndex(t => t.id === id);\n      if (i >= 0) state.tasks.splice(i, 1);\n      save(state);\n    },\n    // 智能排测算法（原型）：清空原占位，按班次/当天找最早空档重新分配。\n    // 工程师无法指定机台或时间 —— 每次编辑都会重排，从机制上杜绝提前占位。\n    autoSchedule(id) {\n      const t = this.task(id);\n      if (!t) return null;\n      const day = t.day || 0;\n      const [lo, hi] = this.SHIFT_RANGE[t.shift];\n      // release current placement first\n      t.machine = null; t.start = null; t.end = null;\n      let best = null;\n      for (const m of this.schedulableMachines()) {\n        const occ = state.tasks.filter(x => x.id !== id && x.machine === m.id && x.start != null\n                      && (x.day || 0) === day && x.shift === t.shift).sort((a, b) => a.start - b.start);\n        let cursor = lo;\n        if (day === 0 && t.shift === 'day') cursor = Math.max(cursor, state.nowMin); // 不排到过去\n        for (const o of occ) { if (o.start - cursor >= t.est) break; cursor = Math.max(cursor, o.end); }\n        if (cursor + t.est \u003c= hi && (!best || cursor \u003c best.start)) best = { machine: m.id, start: cursor };\n      }\n      if (best) { t.machine = best.machine; t.start = best.start; t.end = best.start + t.est; t.status = 'scheduled'; }\n      else { t.status = 'pending'; }\n      save(state);\n      return best;\n    },\n    useManagerAdjust(taskId) {\n      state.meta.managerAdjustUsed = true;\n      state.meta.managerAdjustTask = taskId;\n      save(state);\n    },\n\n    // ---- departments / quota (白班借机配额，仅白天计) ----\n    get departments() { return state.departments; },\n    department(name) { return state.departments.find(d => d.name === name); },\n    quotaUsedMin(deptName, day) {\n      day = day || 0;\n      return state.tasks\n        .filter(t => t.dept === deptName && t.shift === 'day' && (t.day || 0) === day && t.machine && t.start != null)\n        .reduce((a, t) => a + (t.end - t.start), 0);\n    },\n    setDeptQuota(name, fields) {\n      const d = this.department(name);\n      if (d) { Object.assign(d, fields); save(state); }\n    },\n\n    // ---- 借机规则 / 机台零部件说明（Lab 工程师维护，像表格一样增删改）----\n    get borrowRules() { return state.borrowRules; },\n    addBorrowRule(row) { state.borrowRules.push(Object.assign({ id: rowId('BR', state.borrowRules) }, row)); save(state); },\n    updateBorrowRule(id, fields) { const r = state.borrowRules.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeBorrowRule(id) { const i = state.borrowRules.findIndex(x => x.id === id); if (i >= 0) { state.borrowRules.splice(i, 1); save(state); } },\n    // 借机规则 — 按 (机台, 星期) 单元格读写；depts 为部门集合（可多部门共享）\n    borrowRuleFor(machine, weekday) { return state.borrowRules.find(r => r.machine === machine && r.weekday === weekday); },\n    toggleBorrowDept(machine, weekday, dept) {\n      if (!dept) return;\n      let r = this.borrowRuleFor(machine, weekday);\n      if (!r) { state.borrowRules.push({ id: rowId('BR', state.borrowRules), machine, weekday, depts: [dept], note: '' }); save(state               (t) =>\n                t.shift === \"day\" &&\n                t.status === \"scheduled\" &&\n                t.checkedIn === false,\n            ).length,\n          ],\n          [\n            \"pending\",\n            \"待排程\",\n            all.filter((t) => t.status === \"pending\").length,\n          ],\n          [\"fault\", \"异常机台\", abnormal],\n        ];\n        document.getElementById(\"stats\").innerHTML = vals\n          .map(\n            (x) =>\n              `\u003cdiv class=\"stat ${quick === x[0] ? \"active\" : \"\"}\" data-filter=\"${x[0]}\">\u003cdiv>\u003cdiv class=\"stat-label\">${x[1]}\u003c/div>\u003cdiv class=\"stat-value\">${x[2]}\u003c/div>\u003c/div>\u003ci class=\"stat-dot\">\u003c/i>\u003c/div>`,\n          )\n          .join(\"\");\n        document.querySelectorAll(\".stat\").forEach(\n          (s) =>\n            (s.onclick = () => {\n              quick = quick === s.dataset.filter ? \"\" : s.dataset.filter;\n              if (quick === \"fault\")\n                parent.postMessage({ type: 'itest-navigate', href: \"machines.html?status=down\" }, '*');\n              else render();\n            }),\n        );\n      }\n      function plannedTasks(m) {\n        return Store.tasks\n          .filter(\n            (t) =>\n              t.machine === m.id &&\n              t.start != null &&\n              (t.day || 0) === day &&\n              (shift === \"all\" || t.shift === shift),\n          )\n          .sort((a, b) => a.start - b.start);\n      }\n      function actualLog(m) {\n        const lo = shift === \"night\" ? 720 : 0,\n          hi = shift === \"day\" ? 720 : 1440;\n        if (!Store.MACHINE_STATUS[m.status].schedulable)\n          return [{ kind: \"pending\", start: lo, end: hi, label: \"机台不可用\" }];\n        if (day > 0) return [];\n        const boundary =\n          day === 0 ? Math.max(lo, Math.min(hi, Store.nowMin())) : hi;\n        const events = [];\n        plannedTasks(m).forEach((t) => {\n          const seed = [...t.id].reduce(\n            (sum, char) => sum + char.charCodeAt(0),\n            0,\n          );\n          const plannedStart = Math.max(lo, t.start);\n          if ([\"done\", \"running\"].includes(t.status)) {\n            const start = plannedStart + (seed % 3) * 5;\n            if (start > plannedStart)\n              events.push({\n                kind: \"pending\",\n                start: plannedStart,\n                end: Math.min(start, boundary),\n                task: t,\n              });\n            const rawEnd =\n              t.status === \"running\" ? boundary : t.end + ((seed % 5) - 2) * 5;\n            const end = Math.min(hi, boundary, Math.max(start + 5, rawEnd));\n            if (end > start) events.push({ kind: \"run\", start, end, task: t });\n          } else if (plannedStart \u003c boundary) {\n            events.push({\n              kind: \"pending\",\n              start: plannedStart,\n              end: Math.min(boundary, t.end),\n              task: t,\n            });\n          }\n        });\n        events.sort((a, b) => a.start - b.start);\n        const logs = [];\n        let cursor = lo;\n        events.forEach((event) => {\n          const start = Math.max(cursor, event.start);\n          if (event.end \u003c= start) return;\n          if (start > cursor)\n            logs.push({ kind: \"idle\", start: cursor, end: start });\n          logs.push({ ...event, start });\n          cursor = event.end;\n        });\n        if (cursor \u003c boundary)\n          logs.push({ kind: \"idle\", start: cursor, end: boundary });\n        return logs;\n      }\n      function logClock(offset) {\n        return offset >= 1440\n          ? \"次日 \" + Store.minToClock(offset)\n          : offset >= 960\n            ? \"次日 \" + Store.minToClock(offset)\n            : Store.minToClock(offset);\n      }\n      function renderGantt() {\n        const visibleIds = new Set(tasks().map((t) => t.id));\n        let axis = \"\";\n        for (let o = 0; o \u003c= 1440; o += 120)\n          if (o \u003c 1440)\n            axis += `\u003cspan class=\"axis-label\" style=\"left:${o / 14.4}%\">${Store.minToClock(o)}\u003c/span>`;\n        axis +=\n          '\u003cspan class=\"shift-label\" style=\"left:23%\">工作日白班 · PE 自测\u003c/span>\u003cspan class=\"shift-label\" style=\"left:72%\">夜班 · Lab 代测\u003c/span>';\n        let lines = \"\";\n        for (let o = 120; o \u003c 1440; o += 120)\n          lines += `\u003ci class=\"gridline\" style=\"left:${o / 14.4}%\">\u003c/i>`;\n        const now =\n          day === 0\n            ? `\u003ci class=\"now-line dual-now\" style=\"left:${Store.nowMin() / 14.4}%\">\u003c/i>`\n            : \"\";\n        document.getElementById(\"gantt-view\").innerHTML =\n          `\u003cdiv class=\"gantt-wrap\">\u003cdiv class=\"gantt\">\u003cdiv class=\"gantt-head\">\u003cdiv class=\"machine-corner\">机台 / 预测与实际\u003c/div>\u003cdiv class=\"timeline\">${axis}\u003c/div>\u003c/div>${Store.machines\n            .map((m) => {\n              const ms = Store.MACHINE_STATUS[m.status];\n              const forecast = plannedTasks(m)\n                .map((t) => {\n                  const left = t.start / 14.4,\n                    width = Math.max((t.end - t.start) / 14.4, 1.5),\n                    range = logClock(t.start) + \"–\" + logClock(t.end),\n                    filtered = !visibleIds.has(t.id);\n                  return `\u003cdiv class=\"forecast-block ${filtered ? \"filtered\" : \"\"}\" data-task=\"${t.id}\" style=\"left:${left}%;width:${width}%\">\u003cdiv class=\"log-title\">${t.product}\u003c/div>\u003cdiv class=\"log-meta\">预测 ${range} · ${Store.STATUS_META[t.status].label}\u003c/div>\u003c/div>`;\n                })\n                .join(\"\");\n              const actual = actualLog(m)\n                .map((log) => {\n                  const left = log.start / 14.4,\n                    width = Math.max((log.end - log.start) / 14.4, 1.5),\n                    range = logClock(log.start) + \"–\" + logClock(log.end);\n                  if (log.task)\n                    return `\u003cdiv class=\"log-block ${log.kind}\" data-task=\"${log.task.id}\" title=\"${log.kind} ${range}\" style=\"left:${left}%;width:${width}%\">\u003cdiv class=\"log-title\">${log.task.product}\u003c/div>\u003cdiv class=\"log-meta\">${log.kind} · ${range}\u003c/div>\u003c/div>`;\n                  return `\u003cdiv class=\"log-block ${log.kind}\" style=\"left:${left}%;width:${width}%\">\u003cdiv class=\"log-title\">${log.label || log.kind}\u003c/div>\u003cdiv class=\"log-meta\">${range}\u003c/div>\u003c/div>`;\n                })\n                .join(\"\");\n              return `\u003cdiv class=\"gantt-row ${!ms.schedulable ? \"unavailable\" : \"\"}\">\u003cdiv class=\"machine-side\">\u003cdiv class=\"machine-label\">\u003cstrong>${m.name}\u003c/strong>\u003csmall>${m.type.replace(\"测试\", \"\")} · ${m.lab}\u003c/small>\u003c/div>\u003cdiv class=\"lane-labels\">\u003cspan>预测\u003c/span>\u003cspan>实际\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"dual-tracks\">\u003cdiv class=\"track forecast-track\">${lines}${forecast}\u003c/div>\u003cdiv class=\"track log-track\">${lines}${actual}\u003c/div>${now}\u003c/div>\u003c/div>`;\n            })\n            .join(\"\")}\u003c/div>\u003c/div>`;\n        document\n          .querySelectorAll(\".forecast-block[data-task],.log-block[data-task]\")\n          .forEach(\n            (b) =>\n              (b.onclick = () =>\n                V2App.taskDrawer(Store.task(b.dataset.task), render)),\n          );\n      }\n      function overlayActualEvents(machine) {\n        const lo = shift === \"night\" ? 720 : 0,\n          hi = shift === \"day\" ? 720 : 1440;\n        if (!Store.MACHINE_STATUS[machine.status].schedulable)\n          return [{ kind: \"pending\", start: lo, end: hi, label: \"机台不可用\" }];\n        if (day > 0) return [];\n        const boundary =\n            day === 0 ? Math.max(lo, Math.min(hi, Store.nowMin())) : hi,\n          events = [];\n        plannedTasks(machine).forEach((task) => {\n          const seed = [...task.id].reduce(\n              (sum, char) => sum + char.charCodeAt(0),\n              0,\n            ),\n            plannedStart = Math.max(lo, task.start);\n          if ([\"done\", \"running\"].includes(task.status)) {\n            const actualStart = plannedStart + (seed % 3) * 5;\n            if (actualStart > plannedStart)\n              events.push({\n                kind: \"pending\",\n                start: plannedStart,\n                end: Math.min(actualStart, boundary),\n                task,\n              });\n            const rawEnd =\n              task.status === \"running\"\n                ? boundary\n                : task.end + ((seed % 5) - 2) * 5;\n            const actualEnd = Math.min(\n              hi,\n              boundary,\n              Math.max(actualStart + 5, rawEnd),\n            );\n            if (actualEnd > actualStart)\n              events.push({\n                kind: \"run\",\n                start: actualStart,\n                end: actualEnd,\n                task,\n              });\n          } else if (plannedStart \u003c boundary) {\n            events.push({\n              kind: \"pending\",\n              start: plannedStart,\n              end: Math.min(boundary, task.end),\n              task,\n            });\n          }\n        });\n        return events;\n      }\n      function renderOverlayGantt() {\n        const visibleIds = new Set(tasks().map((task) => task.id));\n        let ticks = \"\";\n        for (let offset = 0; offset \u003c 1440; offset += 120)\n          ticks += `\u003cspan class=\"overlay-tick\" style=\"left:${offset / 14.4}%\">${Store.minToClock(offset)}\u003c/span>`;\n        let lines = \"\";\n        for (let offset = 120; offset \u003c 1440; offset += 120)\n          lines += `\u003ci class=\"overlay-gridline\" style=\"left:${offset / 14.4}%\">\u003c/i>`;\n        const now =\n          day === 0\n            ? `\u003ci class=\"overlay-now\" style=\"left:${Store.nowMin() / 14.4}%\">\u003c/i>`\n            : \"\";\n        document.getElementById(\"gantt-view\").innerHTML =\n          `\u003cdiv class=\"overlay-scroll\">\u003cdiv class=\"overlay-gantt\">\u003cdiv class=\"overlay-headrow\">\u003cdiv class=\"overlay-corner\">机台 / 时间\u003c/div>\u003cdiv class=\"overlay-axis\">${ticks}\u003cspan class=\"overlay-band\" style=\"left:22%\">白班 08:00–20:00\u003c/span>\u003cspan class=\"overlay-band\" style=\"left:73%\">夜班 20:00–08:00\u003c/span>\u003c/div>\u003c/div>${Store.machines\n            .map((machine) => {\n              const unavailable =\n                !Store.MACHINE_STATUS[machine.status].schedulable;\n              const plans = plannedTasks(machine)\n                .map((task) => {\n                  const left = task.start / 14.4,\n                    width = Math.max((task.end - task.start) / 14.4, 1.5),\n                    range = logClock(task.start) + \"–\" + logClock(task.end),\n                    filtered = !visibleIds.has(task.id);\n                  return `\u003cdiv class=\"overlay-plan task-${task.status} ${filtered ? \"filtered\" : \"\"}\" data-task=\"${task.id}\" style=\"left:${left}%;width:${width}%\" title=\"预测 · ${task.product} · ${range}\">\u003cspan class=\"overlay-plan-name\">${task.product}\u003c/span>\u003cspan class=\"overlay-plan-time\">${range}\u003c/span>\u003c/div>`;\n                })\n                .join(\"\");\n              const actual = overlayActualEvents(machine)\n                .map((event) => {\n                  const left = event.start / 14.4,\n                    width = Math.max((event.end - event.start) / 14.4, 0.6),\n                    range = logClock(event.start) + \"–\" + logClock(event.end),\n                    taskAttr = event.task ? `data-task=\"${event.task.id}\"` : \"\",\n                    filtered = event.task && !visibleIds.has(event.task.id),\n                    label = event.task\n                      ? event.task.product + \" · \" + range\n                      : event.label || event.kind;\n                  return `\u003cdiv class=\"overlay-actual ${event.kind} ${event.task ? `task-${event.task.status}` : \"\"} ${filtered ? \"filtered\" : \"\"}\" ${taskAttr} style=\"left:${left}%;width:${width}%\" title=\"${event.task ? event.task.product + \" · \" : event.label ? event.label + \" · \" : \"\"}${event.kind} · ${range}\">\u003cspan>${label}\u003c/span>\u003c/div>`;\n                })\n                .join(\"\");\n              return `\u003cdiv class=\"overlay-machine-row ${unavailable ? \"unavailable\" : \"\"}\">\u003cdiv class=\"overlay-machine-cell\">\u003cstrong>${machine.name}\u003c/strong>\u003csmall>${machine.type.replace(\"测试\", \"\")} · ${machine.lab}\u003c/small>\u003cem>${unavailable ? \"不可用\" : \"预测 / 实际叠加\"}\u003c/em>\u003c/div>\u003cdiv class=\"overlay-track\">${lines}\u003ci class=\"overlay-idle\">\u003c/i>${plans}${actual}${now}\u003c/div>\u003c/div>`;\n            })\n            .join(\n              \"\",\n            )}\u003c/div>\u003c/div>\u003cdiv class=\"overlay-help\">上方浅色区块为预测，下方实色条为实际；状态由颜色表达，完整信息悬浮查看。\u003c/div>`;\n        document\n          .querySelectorAll(\"#gantt-view [data-task]\")\n          .forEach((block) =>\n            block.addEventListener(\"click\", () =>\n              V2App.taskDrawer(Store.task(block.dataset.task), render),\n            ),\n          );\n      }\n      function renderList() {\n        const list = tasks();\n        const statusOptions = [\n          \"pending\",\n          \"scheduled\",\n          \"running\",\n          \"done\",\n          \"hold\",\n          \"fail\",\n        ];\n        const groups = listTaskGroups(list);\n        document.getElementById(\"list-view\").innerHTML = groups.length\n          ? `\u003cdiv class=\"workorder-groups\">${groups\n              .map(\n                (lab) => `\u003csection class=\"workorder-lab\">\n                  \u003cdiv class=\"workorder-lab-head\">\u003cdiv>\u003cspan>实验室\u003c/span>\u003cstrong>${lab.name}\u003c/strong>\u003c/div>\u003cspan class=\"chip mono\">${lab.groups.reduce((total, group) => total + group.tasks.length, 0)} 个工单\u003c/span>\u003c/div>\n                  ${lab.groups\n                    .map(\n                      (group) => `\u003csection class=\"list-machine-group\">\n                        \u003cdiv class=\"list-machine-head\">\u003cdiv>\u003cstrong>${group.machine ? group.machine.name : \"待分配机台\"}\u003c/strong>\u003cspan>${group.machine ? `${group.machine.type} · ${group.machine.lab}` : \"尚未分配实验室与机台\"}\u003c/span>\u003c/div>\u003cspan class=\"chip mono\">${group.tasks.length} 个工单\u003c/span>\u003c/div>\n                        \u003cdiv class=\"table-wrap\">\u003ctable class=\"data workorder-table\">\u003cthead>\u003ctr>${role.key === \"manager\" ? '\u003cth class=\"order-col\">顺序\u003c/th>' : \"\"}\u003cth>工单\u003c/th>\u003cth>产品/类型\u003c/th>\u003cth>申请人/部门\u003c/th>\u003cth>班次\u003c/th>\u003cth>计划时间\u003c/th>\u003cth>优先级\u003c/th>\u003cth>状态\u003c/th>\u003cth>备注\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${group.tasks\n                          .map(\n                            (t, index) => `\u003ctr>${role.key === \"manager\" ? `\u003ctd>\u003cdiv class=\"order-btns\">\u003cbutton data-list-move=\"${t.id}\" data-dir=\"-1\" title=\"上移\" ${index === 0 ? \"disabled\" : \"\"}>↑\u003c/button>\u003cbutton data-list-move=\"${t.id}\" data-dir=\"1\" title=\"下移\" ${index === group.tasks.length - 1 ? \"disabled\" : \"\"}>↓\u003c/button>\u003c/div>\u003c/td>` : \"\"}\u003ctd class=\"mono\">${t.id}\u003c/td>\u003ctd>\u003cdiv class=\"cell-title\">${t.product}\u003c/div>\u003cdiv class=\"cell-sub\">${t.type}\u003c/div>\u003c/td>\u003ctd>${t.pe}\u003cdiv class=\"cell-sub\">${t.dept}\u003c/div>\u003c/td>\u003ctd>${t.shift === \"day\" ? \"白班\" : \"夜班\"}\u003c/td>\u003ctd>${t.start != null ? Store.minToClock(t.start) + \"–\" + Store.minToClock(t.end) : \"待规划\"}\u003c/td>\u003ctd>${V2App.priority(t)}\u003c/td>\u003ctd>${role.key === \"lab\" ? `\u003cselect class=\"mini-select list-status-select\" data-list-status=\"${t.id}\">${statusOptions.map((status) => `\u003coption value=\"${status}\" ${t.status === status ? \"selected\" : \"\"}>${Store.STATUS_META[status].label}\u003c/option>`).join(\"\")}\u003c/select>` : V2App.status(t)}\u003c/td>\u003ctd>\u003cdiv class=\"list-note-field\">\u003cspan class=\"list-note-text\" title=\"${escapeHtml(t.note || \"暂无备注\")}\">${escapeHtml(t.note || \"—\")}\u003c/span>${role.key === \"lab\" ? `\u003cbutton class=\"btn small note-button ${t.note ? \"has-note\" : \"\"}\" data-list-note=\"${t.id}\">${t.note ? \"编辑\" : \"填写\"}\u003c/button>` : \"\"}\u003c/div>\u003c/td>\u003ctd>\u003cdiv class=\"list-row-actions\">\u003cbutton class=\"btn small\" data-task=\"${t.id}\">查看\u003c/button>\u003c/div>\u003c/td>\u003c/tr>`,\n                          )\n                          .join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>\n                      \u003c/section>`,\n                    )\n                    .join(\"\")}\n                \u003c/section>`,\n              )\n              .join(\"\")}\u003c/div>`\n          : '\u003cdiv class=\"empty\">当前条件下没有工单\u003c/div>';\n        document\n          .querySelectorAll(\"#list-view [data-list-move]\")\n          .forEach((button) => {\n            button.onclick = () =>\n              moveListTask(\n                button.dataset.listMove,\n                Number(button.dataset.dir),\n              );\n          });\n        document\n          .querySelectorAll(\"#list-view [data-list-status]\")\n          .forEach((select) => {\n            select.onchange = () => {\n              const task = Store.task(select.dataset.listStatus);\n              Store.setTaskStatus(task.id, select.value, task.note);\n              V2App.toast(\n                `${task.id} 状态已更新为「${Store.STATUS_META ' + String(d.getDate()).padStart(2,'0');\n    return { text, wd, isToday: offset === 0 };\n  }\n  function dayName(offset) {\n    return offset === 0 ? '今天' : offset === 1 ? '明天' : offset === -1 ? '昨天'\n         : (offset > 0 ? '+' + offset + '天' : offset + '天');\n  }\n\n  const STATUS_META = {\n    pending:   { label: '待排程',  cls: 'neutral' },\n    scheduled: { label: '已排程',  cls: 'info' },\n    running:   { label: '测试中',  cls: 'running' },\n    done:      { label: '已完成',  cls: 'ok' },\n    hold:      { label: '已挂起',  cls: 'warn' },\n    fail:      { label: '测试异常', cls: 'danger' },\n  };\n  const MACHINE_STATUS = {\n    idle:        { label: '空闲',   cls: 'ok',      schedulable: true  },\n    running:     { label: '运行中', cls: 'running', schedulable: true  },\n    maintenance: { label: '保养中', cls: 'warn',    schedulable: false },\n    fault:       { label: '故障',   cls: 'danger',  schedulable: false },\n  };\n  const PRIO_META = {\n    high: { label: '高', cls: 'p-high', rank: 0 },\n    mid:  { label: '中', cls: 'p-mid',  rank: 1 },\n    low:  { label: '低', cls: 'p-low',  rank: 2 },\n  };\n\n  const Store = {\n    get state() { return state; },\n    get machines() { return state.machines; },\n    get tasks() { return state.tasks; },\n    nowMin: () => state.nowMin,\n    today: () => state.today,\n\n    machine(id) { return state.machines.find(m => m.id === id); },\n    task(id) { return state.tasks.find(t => t.id === id); },\n    tasksByShift(shift) { return state.tasks.filter(t => t.shift === shift); },\n    schedulableMachines() { return state.machines.filter(m => MACHINE_STATUS[m.status].schedulable); },\n\n    setMachineStatus(id, status, note) {\n      const m = this.machine(id);\n      if (!m) return;\n      m.status = status;\n      if (note != null) m.note = note;\n      save(state);\n    },\n    setTaskStatus(id, status, note) {\n      const t = this.task(id);\n      if (!t) return;\n      t.status = status;\n      if (note != null) t.note = note;\n      save(state);\n    },\n    setTaskMachine(id, machine) {\n      const t = this.task(id);\n      if (!t) return;\n      t.machine = machine;\n      t.moved = true;\n      save(state);\n    },\n    setTaskPrio(id, prio) {\n      const t = this.task(id);\n      if (!t) return;\n      t.prio = prio;\n      save(state);\n    },\n    addTask(t) {\n      state.tasks.push(t);\n      save(state);\n    },\n    updateTask(id, fields) {\n      const t = this.task(id);\n      if (!t) return;\n      Object.assign(t, fields);\n      save(state);\n    },\n    removeTask(id) {\n      const i = state.tasks.findIndex(t => t.id === id);\n      if (i >= 0) state.tasks.splice(i, 1);\n      save(state);\n    },\n    // 智能排测算法（原型）：清空原占位，按班次/当天找最早空档重新分配。\n    // 工程师无法指定机台或时间 —— 每次编辑都会重排，从机制上杜绝提前占位。\n    autoSchedule(id) {\n      const t = this.task(id);\n      if (!t) return null;\n      const day = t.day || 0;\n      const [lo, hi] = this.SHIFT_RANGE[t.shift];\n      // release current placement first\n      t.machine = null; t.start = null; t.end = null;\n      let best = null;\n      for (const m of this.schedulableMachines()) {\n        const occ = state.tasks.filter(x => x.id !== id && x.machine === m.id && x.start != null\n                      && (x.day || 0) === day && x.shift === t.shift).sort((a, b) => a.start - b.start);\n        let cursor = lo;\n        if (day === 0 && t.shift === 'day') cursor = Math.max(cursor, state.nowMin); // 不排到过去\n        for (const o of occ) { if (o.start - cursor >= t.est) break; cursor = Math.max(cursor, o.end); }\n        if (cursor + t.est \u003c= hi && (!best || cursor \u003c best.start)) best = { machine: m.id, start: cursor };\n      }\n      if (best) { t.machine = best.machine; t.start = best.start; t.end = best.start + t.est; t.status = 'scheduled'; }\n      else { t.status = 'pending'; }\n      save(state);\n      return best;\n    },\n    useManagerAdjust(taskId) {\n      state.meta.managerAdjustUsed = true;\n      state.meta.managerAdjustTask = taskId;\n      save(state);\n    },\n\n    // ---- departments / quota (白班借机配额，仅白天计) ----\n    get departments() { return state.departments; },\n    department(name) { return state.departments.find(d => d.name === name); },\n    quotaUsedMin(deptName, day) {\n      day = day || 0;\n      return state.tasks\n        .filter(t => t.dept === deptName && t.shift === 'day' && (t.day || 0) === day && t.machine && t.start != null)\n        .reduce((a, t) => a + (t.end - t.start), 0);\n    },\n    setDeptQuota(name, fields) {\n      const d = this.department(name);\n      if (d) { Object.assign(d, fields); save(state); }\n    },\n\n    // ---- 借机规则 / 机台零部件说明（Lab 工程师维护，像表格一样增删改）----\n    get borrowRules() { return state.borrowRules; },\n    addBorrowRule(row) { state.borrowRules.push(Object.assign({ id: rowId('BR', state.borrowRules) }, row)); save(state); },\n    updateBorrowRule(id, fields) { const r = state.borrowRules.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeBorrowRule(id) { const i = state.borrowRules.findIndex(x => x.id === id); if (i >= 0) { state.borrowRules.splice(i, 1); save(state); } },\n    // 借机规则 — 按 (机台, 星期) 单元格读写；depts 为部门集合（可多部门共享）\n    borrowRuleFor(machine, weekday) { return state.borrowRules.find(r => r.machine === machine && r.weekday === weekday); },\n    toggleBorrowDept(machine, weekday, dept) {\n      if (!dept) return;\n      let r = this.borrowRuleFor(machine, weekday);\n      if (!r) { state.borrowRules.push({ id: rowId('BR', state.borrowRules), machine, weekday, depts: [dept], note: '' }); save(state); return; }\n      const i = r.depts.indexOf(dept);\n      if (i >= 0) { r.depts.splice(i, 1); if (r.depts.length === 0) state.borrowRules.splice(state.borrowRules.indexOf(r), 1); }\n      else { r.depts.push(dept); }\n      save(state);\n    },\n    clearBorrow(machine, weekday) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { state.borrowRules.splice(state.borrowRules.indexOf(r), 1); save(state); }\n    },\n    setBorrowNote(machine, weekday, note) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { r.note = note; save(state); }\n    },\n    get machineParts() { return state.machineParts; },\n    addMachinePart(row) { state.machineParts.push(Object.assign({ id: rowId('MP', state.machineParts) }, row)); save(state); },\n    updateMachinePart(id, fields) { const r = state.machineParts.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeMachinePart(id) { const i = state.machineParts.findIndex(x => x.id === id); if (i >= 0) { state.machineParts.splice(i, 1); save(state); } },\n\n    // ---- 节假日日历（已与中国大陆法定节假日同步，自动更新，无需人工维护）----\n    dateKind(dateText) {\n      if (CN_MAKEUP_WORKDAYS.includes(dateText)) return 'makeup';   // 调休上班\n      if (CN_HOLIDAYS.includes(dateText)) return 'holiday';         // 法定节假日\n      const dow = new Date(dateText + 'T00:00:00').getDay();\n      return (dow === 0 || dow === 6) ? 'weekend' : 'workday';\n    },\n    isHoliday(dateText) { const k = this.dateKind(dateText); return k === 'holiday' || k === 'weekend'; },\n    // 某天某时段的执行模式：工作日白班=自助预约；夜间/周末/节假日=算法+Lab 代测\n    mode(dayOffset, shift) {\n      const kind = this.dateKind(dateLabel(dayOffset).text);\n      if (kind === 'holiday') return { kind: 'algo', exec: 'lab', label: '节假日·算法代测' };\n      if (kind === 'weekend') return { kind: 'algo', exec: 'lab', label: '周末·算法代测' };\n      if (shift === 'day') return { kind: 'self', exec: 'pe', label: '工作日白班·自助预约' };\n      return { kind: 'algo', exec: 'lab', label: '工作日夜班·算法代测' };\n    },\n\n    // ---- daytime reservation check-in ----\n    checkIn(id) { const t = this.task(id); if (t) { t.checkedIn = true; t.status = 'running'; save(state); } },\n    checkOut(id, note) { const t = this.task(id); if (t) { t.status = 'done'; if (note != null) t.note = note; save(state); } },\n\n    // ---- role layer (role is now a filter, not a nav axis) ----\n    ROLES: {\n      pe: 03cspan>02\u003c/span>聚焦侧栏\u003c/a>\n  \u003c/nav>` : `\u003cnav class=\"variant-nav\" aria-label=\"样式方案\">\n    ${names.map((name, index) => `\u003ca class=\"${variant === index + 1 ? 'active' : ''}\" href=\"create-style-${index + 1}.html\">\u003cspan>0${index + 1}\u003c/span>${name}\u003c/a>`).join('')}\n  \u003c/nav>`;\n\n  const pageHead = `\u003cdiv class=\"prototype-head\">\n    \u003cdiv>${isOfficial ? '\u003ch1>新建工单\u003c/h1>\u003cp>选择执行方式后，按顺序填写工单信息。\u003c/p>' : isBusinessPreview ? `\u003ch1>新建工单\u003c/h1>\u003cp>${designConcept === 'business-grid' ? '紧凑填写，关键信息一屏完成。' : '按业务分区横向填写，减少视线跳转。'}\u003c/p>` : isDesignPreview ? `\u003cdiv class=\"prototype-kicker\">DESIGN.MD · ${designConcept === 'soft' ? 'SOFT FLOW' : 'FOCUS RAIL'}\u003c/div>\u003ch1>新建工单\u003c/h1>\u003cp>${designConcept === 'soft' ? '沿着清晰顺序，完成一次测试申请。' : '测试信息与排程分区呈现，保持注意力集中。'}\u003c/p>` : `\u003cdiv class=\"prototype-kicker\">新建工单 · 方案 0${variant}\u003c/div>\u003ch1>新建工单\u003c/h1>`}\u003c/div>\n    \u003ca class=\"btn\" href=\"index.html\">返回排测中心\u003c/a>\n  \u003c/div>`;\n\n  const modeSwitch = `\u003cdiv class=\"mode-switch\" role=\"tablist\" aria-label=\"执行方式\">\n    \u003cbutton type=\"button\" class=\"active\" data-mode=\"self\">\u003cstrong>白班自测\u003c/strong>\u003cspan>工作日 08:00–20:00\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-mode=\"algo\">\u003cstrong>夜班 / 休息日\u003c/strong>\u003cspan>Lab 代测 · 算法排程\u003c/span>\u003c/button>\n  \u003c/div>`;\n\n  const identity = `\u003cdiv class=\"identity-strip\">\n    \u003cdiv data-field-label=\"申请人\">\u003cspan>申请人\u003c/span>\u003cstrong id=\"pe\">\u003c/strong>\u003c/div>\n    \u003cdiv data-field-label=\"部门\">\u003cspan>部门\u003c/span>\u003cstrong id=\"dept\">\u003c/strong>\u003c/div>\n  \u003c/div>`;\n\n  const objectSection = `\u003csection class=\"form-block\" data-step=\"01\">\n    \u003cdiv class=\"block-head\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch2>测试对象\u003c/h2>\u003c/div>\u003csmall>基础信息\u003c/small>\u003c/div>\n ct name=\"lab\" required>\u003coption value=\"\">请选择实验室\u003c/option>\u003coption>A区\u003c/option>\u003coption>B区\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>测试主程序 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput name=\"program\" required placeholder=\"例如：Apollo_FCT_v3.2\">\u003c/div>\n      \u003cdiv class=\"field wide temperature-field\">\u003clabel>测试温度 \u003cspan class=\"req\">*\u003c/span>\u003cspan class=\"label-note\">同一主程序可填写多个温度\u003c/span>\u003c/label>\u003cdiv class=\"temperature-rows\" id=\"temperature-rows\">\u003c/div>\u003cbutton class=\"btn small temperature-add\" type=\"button\" id=\"temperature-add\">＋ 新增温度\u003c/button>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>是否分 BIN\u003c/label>\u003cselect name=\"bin\">\u003coption>不需要\u003c/option>\u003coption>需要\u003c/option>\u003c/select>\u003c/div>\n    \u003c/div>\n  \u003c/section>`;\n\n  const scheduleSection = `\u003csection class=\"form-block schedule-block\" data-step=\"03\">\n    \u003cdiv class=\"block-head\">\u003cdiv>\u003cspan data-schedule-step>02\u003c/span>\u003ch2>排程信息\u003c/h2>\u003c/div>\u003csmall id=\"mode-chip\">白班自助预约\u003c/small>\u003c/div>\n    \u003cdiv class=\"notice warn\" id=\"quota\" data-mode-only=\"self\">\u003c/div>\n    \u003cdiv class=\"field-grid schedule-grid\" data-mode-only=\"self\">\n      \u003cdiv class=\"field\" data-field-label=\"预约日期\">\u003clabel>预约日期 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cselect name=\"day\" id=\"day\">\u003c/select>\u003c/div>\n      \u003cdiv class=\"field\" data-field-label=\"预估开始时间\">\u003clabel>预估开始时间 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cselect name=\"start\" id=\"start\">\u003c/select>\u003c/div>\n      \u003cdiv class=\"field\" data-field-label=\"预估测试时长\">\u003clabel>预估测试时长 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"input-suffix\">\u003cinput name=\"selfEst\" type=\"number\" min=\"30\" step=\"30\" value=\"120\" required>\u003cspan>分钟\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\" data-field-label=\"意向机台\">\u003clabel>意向机台 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cselect name=\"machine\" id=\"machine\" required>\u003c/select>\u003c/div>\n      \u003cdiv class=\"field wide\" data-field-label=\"排他机台\">\u003clabel>排他机台\u003c/label>\u003cselect name=\"excludedMachines\" id=\"excluded-machines\" multiple>\u003c/select>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field-grid\" data-mode-only=\"algo\">\n      \u003cdiv class=\"field\">\u003clabel>预估测试时长 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"input-suffix\">\u003cinput name=\"algoEst\" type=\"number\" min=\"30\" step=\"30\" value=\"180\" required>\u003cspan>分钟\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>期望执行日期 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cselect name=\"algoDay\">\u003coption value=\"0\">今晚\u003c/option>\u003coption value=\"1\">明晚\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>优先级\u003c/label>\u003cselect name=\"prio\">\u003coption value=\"mid\">中 · 常规\u003c/option>\u003coption value=\"high\">高 · 关键 / 阻塞\u003c/option>\u003coption value=\"low\">低 · 有空档即可\u003c/option>\u003c/select>\u003c/div>\n    \u003c/div>\n  \u003c/section>`;\n\n  const noteSection = `\u003csection class=\"form-block\" data-mode-only=\"algo\" data-step=\"04\">\n    \u003cdiv class=\"block-head\">\u003cdiv>\u003cspan>04\u003c/span>\u003ch2>补充信息\u003c/h2>\u003c/div>\u003csmall>选填\u003c/small>\u003c/div>\n    \u003cdiv class=\"field-grid\">\u003cdiv class=\"field wide\">\u003clabel>备注\u003c/label>\u003ctextarea name=\"note\" placeholder=\"治具、测试条件或特殊要求\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field wide\">\u003clabel>附件\u003c/label>\u003cinput type=\"file\" multiple>\u003c/div>\u003c/div>\n  \u003c/section>`;\n\n  const summary = `\u003cdiv class=\"live-summary\">\n    \u003cspan>当前工单\u003c/span>\u003cstrong data-summary-product>待选择产品\u003c/strong>\u003cp data-summary-schedule>白班 · 今天 · 08:00\u003c/p>\n  \u003c/div>`;\n\n  const actions = `\u003cdiv class=\"form-actions\">\u003ca class=\"btn\" href=\"index.html\">取消\u003c/a>\u003cbutton class=\"btn primary\" type=\"submit\" id=\"submit\">${V2App.I.plus}提交预约\u003c/button>\u003c/div>`;\n\n  function renderLayout() {\n    const layouts = {\n      1: `\u003cform id=\"showcase-form\" class=\"flow-surface\">${modeSwitch}${identity}${objectSection}${requirementSection}${scheduleSection}${noteSection}${actions}\u003c/form>`,\n      2: `\u003cform id=\"showcase-form\" class=\"rail-layout\">\u003caside class=\"form-rail\">${modeSwitch}${identity}\u003col>\u003cli class=\"active\">测试对象\u003c/li>\u003cli data-mode-only=\"algo\">测试要求\u003c/li>\u003cli>排程信息\u003c/li>\u003cli data-mode-only=\"algo\">补充信息\u003c/li>\u003c/ol>\u003c/aside>\u003cdiv class=\"rail-main\">${objectSection}${requirementSection}${scheduleSection}${noteSection}${actions}\u003c/div>\u003c/form>`,\n      3: `\u003cform id=\"showcase-form\">\u003cdiv class=\"split-top\">${modeSwitch}${identity}\u003c/div>\u003cdiv class=\"split-layout\">\u003cdiv class=\"split-main\">${objectSection}${requirementSection}${noteSection}\u003c/div>\u003caside class=\"split-schedule\">${scheduleSection}${summary}${actions}\u003c/aside>\u003c/div>\u003c/form>`,\n      4: `\u003cform id=\"showcase-form\" class=\"compact-surface\">\u003cdiv class=\"compact-top\">${modeSwitch}${identity}\u003c/div>\u003cdiv class=\"compact-content\">${objectSection}${requirementSection}${scheduleSection}${noteSection}\u003c/div>${actions}\u003c/form>`,\n      5: `\u003cform id=\"showcase-form\" class=\"canvas-form\">\u003cdiv class=\"canvas-toolbar\">${modeSwitch}${identity}\u003c/div>${objectSection}${requirementSection}${scheduleSection}${noteSection}\u003cdiv class=\"canvas-bottom\">${summary}${actions}\u003c/div>\u003c/form>`\n    };\n    document.getElementById('create-app').innerHTML = `${pageHead}${variantNav}${layouts[variant]}`;\n  }\n\n  function setText(id, value) {\n    document.getElementById(id).textContent = value;\n  }\n\n  function fillOptions() {\n    const machines = Store.schedulableMachines();\n    const machineOptions = machines.map(machine => `\u003coption value=\"${machine.id}\">${machine.name} · ${machine.type} · ${machine.lab}\u003c/option>`).join('');\n    document.getElementById('machine').innerHTML = machineOptions;\n    document.getElementById('excluded-machines').innerHTML = machineOptions;\n\n    const selfDays = [0, 1, 2, 3].filter(day => Store.mode(day, 'day').kind === 'self');\n    document.getElementById('day').innerHTML = selfDays.map(day => `\u003coption value=\"${day}\">${Store.dateLabel(day).text} · ${Store.dayName(day)}\u003c/option>`).join('');\n\n    let times = '';\n    for (let offset = 0; offset \u003c= 690; offset += 30) {\n      times += `\u003coption value=\"${offset}\">${Store.minToClock(offset)}\u003c/option>`;\n    }\n    document.getElementById('start').innerHTML = times;\n  }\n\n  function renderQuota() {\n    const department = Store.department(currentDept);\n    const day = Number(document.getElementById('day').value || 0);\n    const used = Store.quotaUsedMin(currentDept, day);\n    document.getElementById('quota').innerHTML = `\u003cstrong>${currentDept}\u003c/strong>\u003cspan>${Store.dayName(day)}已用 ${used} / ${department.dailyQuotaMin} 分钟 · 剩余 ${Math.max(0, department.dailyQuotaMin - used)} 分钟\u003c/span>`;\n  }\n\n  function normalizeTemperature(value) {\n    const normalized = value.trim().replace(/°C$/i, '℃');\n    if (!normalized) return '';\n    return /℃$/.test(normalized) ? normalized : `${normalized}℃`;\n  }\n\n  function addTemperatureRow(value = '') {\n    const row = document.createElement('div');\n    row.className = 'temperature-row';\n    row.innerHTML = `\u003cinput name=\"temperatures\" type=\"text\" value=\"${value}\" placeholder=\"手动填写温度，如 25℃\">\u003cbutton class=\"btn small\" type=\"button\" data-remove-temperature>删除\u003c/button>`;\n    row.querySelector('[data-remove-temperature]').addEventListener('click', () => {\n      row.remove();\n      if (!document.querySelector('.temperature-row')) addTemperatureRow();\n    });\n    document.getElementById('temperature-rows').appendChild(row);\n    if (activeMode === 'self') row.querySelector('input').disabled = true;\n  }\n\n  function updateSummary() {\n    const form = document.getElementById('showcase-form');\n    const product = form.elements.model.value || '待选择产品';\n    const isSelf = activeMode === 'self';\n    document.querySelectorAll('[data-summary-product]').forEach(element => { element.textContent = product; });\n    const schedule = isSelf\n      ? `白班 · ${Store.dayName(Number(form.elements.day.value || 0))} · ${Store.minToClock(Number(form.elements.start.value || 0))}`\n      : `夜班 · ${form.elements.algoDay.selectedOptions[0].textContent} · 算法排程`;\n    document.querySelectorAll('[data-summary-schedule]').forEach(element => { element.textContent = schedule; });\n  }\n\n  function setMode(mode) {\n    activeMode = mode;\n    const isSelf = activeMode === 'self';\n    document.querySelectorAll('[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === activeMode));\n    document.querySelectorAll('[data-mode-only]').forEach(element => {\n      const visible = element.dataset.modeOnly === activeMode;\n      element.hidden = !visible;\n      element.querySelectorAll('input,select,textarea').forEach(control => { control.disabled = !visible; });\n    });\n    document.querySelectorAll('[data-schedule-step]').forEach(element => { element.textContent = isSelf ? '02' : '03'; });\n    document.getElementById('mode-chip').textContent = isSelf ? '白班自助预约' : '算法统一排程';\n    document.getElementById('submit').innerHTML = `${V2App.I.plus}${isSelf ? '提交预约' : '提交需求'}`;\n    updateSummary();\n  }\n\n  function submitForm(event) {\n    event.preventDefault();\n    const formData = new FormData(event.currentTarget);\n    const isSelf = activeMode === 'self';\n    const estimatedDuration = Number(formData.get(isSelf ? 'selfEst' : 'algoEst'));\n    const id = (isSelf ? 'R-' : 'T-') + Math.floor(6000 + Math.random() * 3000);\n    const baseTask = {\n      id,\n      pe: currentUser,\n      dept: currentDept,\n      product: formData.get('model'),\n      type: formData.get('type'),\n      purpose: formData.get('purpose'),\n      est: estimatedDuration,\n      status: isSelf ? 'scheduled' : 'pending'\n    };\n\n    if (isSelf) {\n      const preferredMachine = formData.get('machine');\n      const excludedMachines = formData.getAll('excludedMachines');\n      if (excludedMachines.includes(preferredMachine)) {\n        V2App.toast('意向机台不能同时设为排他机台', 'warn');\n        return;\n      }\n      const start = Number(formData.get('start'));\n      Store.addTask({ ...baseTask, day: Number(formData.get('day')), shift: 'day', machine: preferredMachine, preferredMachine, excludedMachines, start, end: start + estimatedDuration, prio: 'mid', source: 'self', checkedIn: false });\n    } else {\n      const temperatures = [...new Set(formData.getAll('temperatures').map(normalizeTemperature).filter(Boolean))];\n      if (temperatures.length === 0) {\n        V2App.toast('请至少添加一个测试温度', 'warn');\n        return;\n      }\n      Store.addTask({ ...baseTask, day: Number(formData.get('algoDay')), shift: 'night', machine: null, start: null, end: null, prio: formData.get('prio'), serial: formData.get('serial'), batch: formData.get('batch'), qty: Number(formData.get('qty')), lab: formData.get('lab'), temps: temperatures, temperature: temperatures.join('、'), program: formData.get('program'), splitBin: formData.get('bin'), note: formData.get('note') || '' });\n      Store.autoSchedule(id);\n    }\n    if (isOfficial) {\n      V2App.toast(`${id} 已创建，正在返回排测中心`);\n      setTimeout(() => { parent.postMessage({ type: 'itest-navigate', href: `index.html?focus=${i \n  border-radius: 3px;\n}\n.overlay-machine-row + .overlay-machine-row .overlay-now:before {\n  content: none;\n}\n.overlay-plan {\n  position: absolute;\n  top: 6px;\n  height: 32px;\n  border: 1px solid #8da4cf;\n  border-radius: 4px;\n  background: #eef3fb;\n  color: #405a88;\n  z-index: 1;\n  overflow: hidden;\n  cursor: pointer;\n}\n.overlay-plan-name {\n  position: absolute;\n  left: 6px;\n  right: 5px;\n  top: 3px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  font-size: 9px;\n  font-weight: 700;\n}\n.overlay-plan-time {\n  position: absolute;\n  left: 6px;\n  right: 4px;\n  top: 16px;\n  font:\n    8px \"SFMono-Regular\",\n    Consolas,\n    monospace;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.overlay-actual {\n  position: absolute;\n  top: 48px;\n  height: 16px;\n  border-radius: 3px;\n  z-index: 3;\n  cursor: pointer;\n  min-width: 3px;\n}\n.overlay-actual.run {\n  background: #087bc1;\n}\n.overlay-actual.pending {\n  background: #d8992f;\n}\n.overlay-actual:hover {\n  filter: brightness(0.9);\n  z-index: 5;\n}\n.overlay-actual span {\n  position: absolute;\n  left: 5px;\n  right: 3px;\n  top: 1px;\n  color: #fff;\n  font:\n    8px/14px \"SFMono-Regular\",\n    Consolas,\n    monospace;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.overlay-actual.pending span {\n  color: #3d2908;\n}\n.overlay-plan.filtered,\n.overlay-actual.filtered {\n  opacity: 0.25;\n}\n.overlay-machine-row:not(.unavailable) .overlay-plan.task-done {\n  background: #e7f5ed;\n  border-color: #75b993;\n  color: #226a46;\n}\n.overlay-machine-row:not(.unavailable) .overlay-plan.task-running {\n  background: #e6f2fb;\n  border-color: #61a7d3;\n  color: #075f99;\n}\n.overlay-machine-row:not(.unavailable) .overlay-actual.run.task-done {\n  background: #278867;\n}\n.overlay-machine-row:not(.unavailable) .overlay-actual.run.task-running {\n  background: #087bc1;\n}\n.overlay-machine-row.unavailable,\n.overlay-machine-row.unavailable .overlay-machine-cell,\n.overlay-machine-row.unavailable .overlay-track {\n  background: #f1f3f5;\n}\n.overlay-machine-row.unavailable .overlay-machine-cell {\n  color: #697386;\n}\n.overlay-machine-row.unavailable .overlay-plan {\n  background: #e1e5ea;\n  border-color: #aab2bd;\n  color: #68717f;\n}\n.overlay-machine-row.unavailable .overlay-actual.pending {\n  background: #aeb6c2;\n}\n.overlay-machine-row.unavailable .overlay-idle {\n  display: none;\n}\n.overlay-help {\n  padding: 8px 12px;\n  border-top: 1px solid var(--border);\n  background: #fafbfc;\n  color: #667085;\n  font-size: 10px;\n}\n.machine-list {\n  display: block;\n}\n.machine-stats .stat {\n  width: 100%;\n  color: var(--text);\n  text-align: left;\n  font: inherit;\n}\n.machine-stats .stat[data-filter=\"all\"] .stat-dot {\n  background: var(--gray);\n}\n.machine-stats .stat[data-filter=\"idle\"] .stat-dot {\n  background: var(--green);\n}\n.machine-stats .stat[data-filter=\"running\"] .stat-dot {\n  background: var(--blue);\n}\n.machine-stats .stat[data-filter=\"down\"] .stat-dot {\n  background: var(--red);\n}\n.lab-section + .lab-section {\n  margin-top: 28px;\n  padding-top: 24px;\n  border-top: 1px solid var(--border);\n}\n.lab-section-head,\n.model-section-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n.lab-section-head {\n  margin-bottom: 14px;\n}\n.lab-section-head h2 {\n  font-size: 19px;\n  margin: 1px 0 0;\n}\n.lab-kicker,\n.model-kicker {\n  display: block;\n  color: var(--muted);\n  font-size: 10px;\n  font-weight: 700;\n}\n.model-section + .model-section {\n  margin-top: 18px;\n}\n.model-section {\n  padding: 13px 14px 14px;\n  border: 1px solid var(--border);\n  border-radius: 7px;\n  background: #fafbfc;\n}\n.model-section-head {\n  margin-bottom: 10px;\n}\n.model-section-head h3 {\n  font-size: 14px;\n  margin: 1px 0 0;\n}\n.machine-card-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 10px;\n}\n.machine-card-grid .machine-card {\n  min-height: 180px;\n}\n.machine-card.unavailable {\n  background: #f1f3f5;\n  color: #697386;\n}\n.machine-code {\n  font-size: 10px;\n  color: var(--muted);\n}\n.machine-card-info {\n  display: grid;\n  grid-template-columns: 46px 1fr;\n  gap: 5px 9px;\n  margin: 12px 0 0;\n}\n.machine-card-info dt,\n.machine-card-info dd {\n  margin: 0;\n  font-size: 11px;\n}\n.machine-card-info dt {\n  color: var(--muted);\n}\n.machine-card-info dd {\n  font-weight: 600;\n}\n.machine-card-grid .machine-card .next {\n  margin-top: 12px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\u003c/style>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n    \u003ctitle>机台 · iTest\u003c/title>\n    \n  \u003c/head>\n  \u003cbody>\n    \u003cmain class=\"shell\">\n      \u003cdiv class=\"page-title-row\">\n        \u003cdiv class=\"page-title\">\n          \u003ch1>机台\u003c/h1>\n          \u003cp>按实验室、机型或今日使用部门查看机台名称、IP 和实时状态。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv\n        class=\"stats machine-stats\"\n        id=\"stats\"\n        style=\"grid-template-columns: repeat(4, 1fr)\"\n      >\u003c/div>\n      \u003cdiv\n        class=\"toolbar\"\n        style=\"\n          background: #fff;\n          border: 1px solid var(--border);\n          border-radius: 8px 8px 0 0;\n        \"\n      >\n        \u003cdiv class=\"seg\" id=\"grouping\" aria-label=\"机台分组方式\">\n          \u003cbutton data-group=\"lab\" class=\"active\">按实验室\u003c/button\n          >\u003cbutton data-group=\"dept\">按部门\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"toolbar-spacer\">\u003c/div>\n        \u003cinput\n          class=\"search\"\n          id=\"search\"\n          placeholder=\"搜索部门、实验室、机型、机台名称或 IP\"\n        />\n      \u003c/div>\n      \u003csection class=\"panel\" style=\"border-radius: 0 0 8px 8px\">\n        \u003cdiv class=\"panel-body\">\u003cdiv class=\"machine-list\" id=\"list\">\u003c/div>\u003c/div>\n      \u003c/section>\n    \u003c/main>\n    \u003cscript>/* ============================================================\n   iTest 智能排测系统 — shared mock data + state layer\n   Persisted to localStorage so edits flow across pages.\n   Time model: timeline offset 0 = 08:00; 1440 min span = 08:00→next 08:00\n     Day shift   白班 : offset    0 – 720   (08:00 – 20:00)\n     Night shift 夜班 : offset  720 – 1440  (20:00 – 08:00)\n   ============================================================ */\n(function (global) {\n  const KEY = 'itest-state-v7';\n\n  // simulated \"current time\": 14:40 → day shift in progress\n  const NOW_MIN = 400;\n\n  // 中国大陆法定节假日日历（2026，自动同步，无需人工维护）\n  const CN_HOLIDAYS = [\n    '2026-01-01',                                                                                       // 元旦\n    '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22',         // 春节\n    '2026-04-04','2026-04-05','2026-04-06',                                                             // 清明\n    '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',                                   // 劳动节\n    '2026-06-19','2026-06-20','2026-06-21',                                                             // 端午\n    '2026-09-25','2026-09-26','2026-09-27',                                                             // 中秋\n    '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08', // 国庆\n  ];\n  // 调休上班日（落在周末但需上班）\n  const CN_MAKEUP_WORKDAYS = ['2026-02-14', '2026-02-15', '2026-04-26', '2026-10-10'];\n\n  const SEED = {\n    nowMin: NOW_MIN,\n    today: '2026-06-10',\n    meta: {\n      // PE manager: one priority bump per day, for a single task\n      managerAdjustUsed: false,\n      managerAdjustTask: null,\n      noShowToday: 1,          // 白班未签到被自动释放次数（恶性占机治理埋点）\n      autoReleased: ['T-1009'],\n    },\n    // 部门：优先级(rank 越小越高) + 每日白班机时配额(分钟，仅白天计)\n    departments: [\n      { name: '研发一部', rank: 1, dailyQuotaMin: 600 },\n      { name: '研发二部', rank: 2, dailyQuotaMin: 480 },\n      { name: '研发三部', rank: 3, dailyQuotaMin: 360 },\n    ],\n    config: { checkinGraceMin: 15, leadDays: 3 },   // 签到宽限期 / 预约提前量(当天~T+3)\n    // 借机规则：周一至周五 × 机台 的「优先预约部门」单元格（Lab 维护，不定期更新）\n    // 每条 = 一个 (机台, 星期) 单元格，depts 为该格拥有优先权的部门集合（可多个共享）。\n    borrowRules: [\n      { id: 'BR-1',  machine: 'ICT-A',   weekday: '周一', depts: ['研发一部'],          note: '主板 ICT 量产优先窗口' },\n      { id: 'BR-2',  machine: 'ICT-A',   weekday: '周二', depts: ['研发一部','研发二部'], note: '两部门共享，按部门优先级排队' },\n      { id: 'BR-3',  machine: 'ICT-A',   weekday: '周三', depts: ['研发二部'],          note: '' },\n      { id: 'BR-4',  machine: 'ICT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-5',  machine: 'ICT-A',   weekday: '周五', depts: ['研发三部'],          note: '周末前补测' },\n      { id: 'BR-6',  machine: 'ICT-B',   weekday: '周一', depts: ['研发一部'],          note: '' },\n      { id: 'BR-7',  machine: 'ICT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-8',  machine: 'ICT-B',   weekday: '周三', depts: ['研发一部','研发三部'], note: '' },\n      { id: 'BR-9',  machine: 'ICT-B',   weekday: '周五', depts: ['研发一部'],          note: '' },\n      { id: 'BR-10', machine: 'FCT-A',   weekday: '周一', depts: ['研发一部','研发三部'], note: '共享窗口' },\n      { id: 'BR-11', machine: 'FCT-A',   weekday: '周二', depts: ['研发三部'],          note: '整机功能测试' },\n      { id: 'BR-12', machine: 'FCT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-13', machine: 'FCT-A',   weekday: '周五', depts: ['研发二部'],          note: '' },\n      { id: 'BR-14', machine: 'FCT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-15', machine: 'RF-01',   weekday: '周一', depts: ['研发三部'],          note: '周一上午校准，期间不可约' },\n      { id: 'BR-16', machine: 'RF-01',   weekday: '周二', depts 0;\n    return (h ? h + 'h' : '') + (m ? m + 'min' : (h ? '' : '0min'));\n  }\n  // date label for a day-offset relative to the simulated \"today\" (state.today)\n  function dateLabel(offset) {\n    const base = new Date(state.today + 'T00:00:00');\n    const d = new Date(base.getTime() + offset * 86400000);\n    const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];\n    const text = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n    return { text, wd, isToday: offset === 0 };\n  }\n  function dayName(offset) {\n    return offset === 0 ? '今天' : offset === 1 ? '明天' : offset === -1 ? '昨天'\n         : (offset > 0 ? '+' + offset + '天' : offset + '天');\n  }\n\n  const STATUS_META = {\n    pending:   { label: '待排程',  cls: 'neutral' },\n    scheduled: { label: '已排程',  cls: 'info' },\n    running:   { label: '测试中',  cls: 'running' },\n    done:      { label: '已完成',  cls: 'ok' },\n    hold:      { label: '已挂起',  cls: 'warn' },\n    fail:      { label: '测试异常', cls: 'danger' },\n  };\n  const MACHINE_STATUS = {\n    idle:        { label: '空闲',   cls: 'ok',      schedulable: true  },\n    running:     { label: '运行中', cls: 'running', schedulable: true  },\n    maintenance: { label: '保养中', cls: 'warn',    schedulable: false },\n    fault:       { label: '故障',   cls: 'danger',  schedulable: false },\n  };\n  const PRIO_META = {\n    high: { label: '高', cls: 'p-high', rank: 0 },\n    mid:  { label: '中', cls: 'p-mid',  rank: 1 },\n    low:  { label: '低', cls: 'p-low',  rank: 2 },\n  };\n\n  const Store = {\n    get state() { return state; },\n    get machines() { return state.machines; },\n    get tasks() { return state.tasks; },\n    nowMin: () => state.nowMin,\n    today: () => state.today,\n\n    machine(id) { return state.machines.find(m => m.id === id); },\n    task(id) { return state.tasks.find(t => t.id === id); },\n    tasksByShift(shift) { return state.tasks.filter(t => t.shift === shift); },\n    schedulableMachines() { return state.machines.filter(m => MACHINE_STATUS[m.status].schedulable); },\n\n    setMachineStatus(id, status, note) {\n      const m = this.machine(id);\n      if (!m) return;\n      m.status = status;\n      if (note != null) m.note = note;\n      save(state);\n    },\n    setTaskStatus(id, status, note) {\n      const t = this.task(id);\n      if (!t) return;\n      t.status = status;\n      if (note != null) t.note = note;\n      save(state);\n    },\n    setTaskMachine(id, machine) {\n      const t = this.task(id);\n      if (!t) return;\n      t.machine = machine;\n      t.moved = true;\n      save(state);\n    },\n    setTaskPrio(id, prio) {\n      const t = this.task(id);\n      if (!t) return;\n      t.prio = prio;\n      save(state);\n    },\n    addTask(t) {\n      state.tasks.push(t);\n      save(state);\n    },\n    updateTask(id, fields) {\n      const t = this.task(id);\n      if (!t) return;\n      Object.assign(t, fields);\n      save(state);\n    },\n    removeTask(id) {\n      const i = state.tasks.findIndex(t => t.id === id);\n      if (i >= 0) state.tasks.splice(i, 1);\n      save(state);\n    },\n    // 智能排测算法（原型）：清空原占位，按班次/当天找最早空档重新分配。\n    // 工程师无法指定机台或时间 —— 每次编辑都会重排，从机制上杜绝提前占位。\n    autoSchedule(id) {\n      const t = this.task(id);\n      if (!t) return null;\n      const day = t.day || 0;\n      const [lo, hi] = this.SHIFT_RANGE[t.shift];\n      // release current placement first\n      t.machine = null; t.start = null; t.end = null;\n      let best = null;\n      for (const m of this.schedulableMachines()) {\n        const occ = state.tasks.filter(x => x.id !== id && x.machine === m.id && x.start != null\n                      && (x.day || 0) === day && x.shift === t.shift).sort((a, b) => a.start - b.start);\n        let cursor = lo;\n        if (day === 0 && t.shift === 'day') cursor = Math.max(cursor, state.nowMin); // 不排到过去\n        for (const o of occ) { if (o.start - cursor >= t.est) break; cursor = Math.max(cursor, ine, weekday, depts: [dept], note: '' }); save(state); return; }\n      const i = r.depts.indexOf(dept);\n      if (i >= 0) { r.depts.splice(i, 1); if (r.depts.length === 0) state.borrowRules.splice(state.borrowRules.indexOf(r), 1); }\n      else { r.depts.push(dept); }\n      save(state);\n    },\n    clearBorrow(machine, weekday) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { state.borrowRules.splice(state.borrowRules.indexOf(r), 1); save(state); }\n    },\n    setBorrowNote(machine, weekday, note) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { r.note = note; save(state); }\n    },\n    get machineParts() { return state.machineParts; },\n    addMachinePart(row) { state.machineParts.push(Object.assign({ id: rowId('MP', state.machineParts) }, row)); save(state); },\n    updateMachinePart(id, fields) { const r = state.machineParts.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeMachinePart(id) { const i = state.machineParts.findIndex(x => x.id === id); if (i >= 0) { state.machineParts.splice(i, 1); save(state); } },\n\n    // ---- 节假日日历（已与中国大陆法定节假日同步，自动更新，无需人工维护）----\n    dateKind(dateText) {\n      if (CN_MAKEUP_WORKDAYS.includes(dateText)) return 'makeup';   // 调休上班\n      if (CN_HOLIDAYS.includes(dateText)) return 'holiday';         // 法定节假日\n      const dow = new Date(dateText + 'T00:00:00').getDay();\n      return (dow === 0 || dow === 6) ? 'weekend' : 'workday';\n    },\n    isHoliday(dateText) { const k = this.dateKind(dateText); return k === 'holiday' || k === 'weekend'; },\n    // 某天某时段的执行模式：工作日白班=自助预约；夜间/周末/节假日=算法+Lab 代测\n    mode(dayOffset, shift) {\n      const kind = this.dateKind(dateLabel(dayOffset).text);\n      if (kind === 'holiday') return { kind: 'algo', exec: 'lab', label: '节假日·算法代测' };\n      if (kind === 'weekend') return { kind: 'algo', exec: 'lab', label: '周末·算法代测' };\n      if (shift === 'day') return { kind: 'self', exec: 'pe', label: '工作日白班·自助预约' };
