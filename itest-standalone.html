ce((labs, machine) => {\n          const lab = labName(machine);\n          let labGroup = labs.find((group) => group.name === lab);\n          if (!labGroup) {\n            labGroup = { name: lab, models: [] };\n            labs.push(labGroup);\n          }\n          let modelGroup = labGroup.models.find(\n            (group) => group.name === machine.type,\n          );\n          if (!modelGroup) {\n            modelGroup = { name: machine.type, machines: [] };\n            labGroup.models.push(modelGroup);\n          }\n          modelGroup.machines.push(machine);\n          return labs;\n        }, []);\n      }\n      function groupedModels(machines) {\n        return machines.reduce((models, machine) => {\n          let modelGroup = models.find(\n            (group) => group.name === machine.type,\n          );\n          if (!modelGroup) {\n            modelGroup = { name: machine.type, machines: [] };\n            models.push(modelGroup);\n          }\n          modelGroup.machines.push(machine);\n          return models;\n        }, []);\n      }\n      function machineDepartments(machine) {\n        const departments = Store.tasks\n          .filter(\n            (task) =>\n              task.machine === machine.id && (task.day || 0) === 0,\n          )\n          .map((task) => task.dept)\n          .filter(Boolean);\n        if (departments.length) return [...new Set(departments)];\n        return [machine.owner === \"设备组\" ? \"设备组\" : \"未分配部门\"];\n      }\n      function groupedByDepartment(machines) {\n        const groups = new Map();\n        machines.forEach((machine) => {\n          machineDepartments(machine).forEach((department) => {\n            if (!groups.has(department)) groups.set(department, []);\n            groups.get(department).push(machine);\n          });\n        });\n        const departmentOrder = Store.state.departments.map(\n          (department) => department.name,\n        );\n        return [...groups]\n          .map(([nam 台\u003c/span>\n              \u003c/div>\n              ${lab.models\n                .map(\n                  (model) => `\u003csection class=\"model-section\">\n                    \u003cdiv class=\"model-section-head\">\n                      \u003cdiv>\u003cspan class=\"model-kicker\">机型\u003c/span>\u003ch3>${model.name}\u003c/h3>\u003c/div>\n                      \u003cspan class=\"muted\">${model.machines.length} 台\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"machine-card-grid\">${model.machines.map(machineCard).join(\"\")}\u003c/div>\n                  \u003c/section>`,\n                )\n                .join(\"\")}\n            \u003c/section>`,\n          )\n          .join(\"\");\n      }\n      function renderDepartmentGroups(machines) {\n        return groupedByDepartment(machines)\n          .map(\n            (department) => `\u003csection class=\"lab-section department-section\">\n              \u003cdiv class=\"lab-section-head\">\n                \u003cdiv>\u003cspan class=\"lab-kicker\">今日使用部门\u003c/span>\u003ch2>${department.name}\u003c/h2>\u003c/div>\n                \u003cspan class=\"chip mono\">${department.models.reduce((count, model) => count + model.machines.length, 0)} 台机台\u003c/span>\n              \u003c/div>\n              ${department.models\n                .map(\n                  (model) => `\u003csection class=\"model-section\">\n                    \u003cdiv class=\"model-section-head\">\n                      \u003cdiv>\u003cspan class=\"model-kicker\">机型\u003c/span>\u003ch3>${model.name}\u003c/h3>\u003c/div>\n                      \u003cspan class=\"muted\">${model.machines.length} 台\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"machine-card-grid\">${model.machines.map(machineCard).join(\"\")}\u003c/div>\n                  \u003c/section>`,\n                )\n                .join(\"\")}\n            \u003c/section>`,\n          )\n          .join(\"\");\n      }\n      function render() {\n        const M = Store.machines,\n          idle = M.filter((m) => m.status === \"idle\").length,\n          run = M.filter((m) => m.status === \"running\").length,\n          down = M.length - idle - run;\n        document.getElementById(\"stats\").innerHTML = [\n          [\"all\", \"机台总数\", M.length],\n          [\"idle\", \"空闲可用\", idle],\n          [\"running\", \"运行中\", run],\n          [\"down\", \"不可排程\", down],\n        ]\n          .map(\n            (x) =>\n              `\u003cbutton type=\"button\" class=\"stat ${filter === x[0] ? \"active\" : \"\"}\" data-filter=\"${x[0]}\" aria-pressed=\"${filter === x[0]}\">\u003cdiv>\u003cdiv class=\"stat-label\">${x[1]}\u003c/div>\u003cdiv class=\"stat-value\">${x[2]}\u003c/div>\u003c/div>\u003ci class=\"stat-dot\">\u003c/i>\u003c/button>`,\n          )\n          .join(\"\");\n        document\n          .querySelectorAll(\"#grouping button\")\n          .forEach((button) =>\n            button.classList.toggle(\n              \"active\",\n              button.dataset.group === groupBy,\n            ),\n          );\n        let list = M.filter(\n          (m) =>\n            filter === \"all\" ||\n            (filter === \"down\"\n              ? !Store.MACHINE_STATUS[m.status].schedulable\n              : m.status === filter),\n        ).filter((m) =>\n          [\n            m.name,\n            m.type,\n            m.lab,\n            machineIp(m),\n            ...machineDepartments(m),\n          ]\n            .join(\" \")\n            .toLowerCase()\n            .includes(q.toLowerCase()),\n        );\n        document.getElementById(\"list\").innerHTML = list.length\n          ? groupBy === \"dept\"\n            ? renderDepartmentGroups(list)\n            : renderLabGroups(list)\n          : '\u003cdiv class=\"empty\">当前条件下没有机台\u003c/div>';\n        document\n          .querySelectorAll(\".machine-card\")\n          .forEach((c) => (c.onclick = () => openMachine(c.dataset.id)));\n      }\n      function openMachine(id) {\n        const m = Store.machine(id),\n          ms = Store.MACHINE_STATUS[m.status],\n          ts = Store.tasks.filter(\n            (t) => t.machine === id && (t.day || 0) === 0,\n          ),\n          part = (Store.machineParts || []).find((p) => p.machine === m.name);\n        V2App.openDrawer(\n          `\u003cdiv class=\"drawer-head\">\u003cdiv>\u003ch2>${m.name}\u003c/h2>\u003cdiv class=\"muted\">${m.type} · ${m.lab}\u003c/div>\u003c/div>\u003cbutton class=\"icon-btn\" data-close-drawer>${V2App.I.close}\u003c/button>\u003c/div>\u003cdiv class=\"drawer-body\">\u003cdiv class=\"detail-hero\">\u003cstrong class=\"machine-status ${ms.schedulable ? \"ok\" : \"bad\"}\">\u003ci>\u003c/i>${ms.label}\u003c/strong>\u003cspan class=\"muted\">${ms.schedulable ? \"参与后续排程\" : \"已从后续排程中排除\"}\u003c/span>\u003c/div>\u003cdl class=\"kv\">\u003cdt>机台 IP\u003c/dt>\u003cdd class=\"mono\">${machineIp(m)}\u003c/dd>\u003cdt>实验室\u003c/dt>\u003cdd>${labName(m)}\u003c/dd>\u003cdt>机型\u003c/dt>\u003cdd>${m.type}\u003c/dd>\u003cdt>机台位置\u003c/dt>\u003cdd>${m.lab}\u003c/dd>\u003cdt>负责人\u003c/dt>\u003cdd>${m.owner || \"—\"}\u003c/dd>\u003cdt>状态备注\u003c/dt>\u003cdd>${m.note || \"—\"}\u003c/dd>\u003cdt>今日工单\u003c/dt>\u003cdd>${ts.length} 个\u003c/dd>\u003cdt>治具/零部件\u003c/dt>\u003cdd>${part ? part.part : \"暂无记录\"}\u003c/dd>\u003cdt>适配规格\u003c/dt>\u003cdd>${part ? part.spec : \"—\"}\u003c/dd>\u003c/dl>\u003ch3 class=\"section-title\">今日工单\u003c/h3>${ts.map((t) => `\u003cdiv style=\"padding:8px 0;border-bottom:1px solid #edf0f3\">\u003cb>${t.id} · ${t.product}\u003c/b>\u003cdiv class=\"cell-sub\">${Store.minToClock(t.start)}–${Store.minToClock(t.end)} · ${Store.STATUS_META[t.status].label}\u003c/div>\u003c/div>`).join(\"\") || '\u003cdiv class=\"muted\">暂无\u003c/div>'}\u003c/div>\u003cdiv class=\"drawer-foot\">\u003ca class=\"btn\" href=\"index.html\">查看完整排程\u003c/a>${Store.role().key === \"lab\" ? '\u003cbutton class=\"btn primary\" id=\"change-status\">调整状态\u003c/button>' : \"\"}\u003c/div>`,\n        );\n        document\n          .getElementById(\"change-status\")\n          ?.addEventListener(\"click\", () => {\n            const next = m.status === \"fault\" ? \"idle\" : \"fault\";\n            Store.setMachineStatus(\n              id,\n              next,\n              next === \"fault\" ? \"现场发现异常，待检修\" : \"检查完成，已恢复\",\n            );\n            V2App.toast(\n              m.name + \" 已更新为\" + Store.MACHINE_STATUS[next].label,\n            );\n            V2App.closeDrawer();\n            render();\n          });\n      }\n      document.getElementById(\"stats\").onclick = (event) => {\n        const card = event.target.closest(\"[data-filter]\");\n        if (!card) return;\n        filter = card.dataset.filter;\n        render();\n      };\n      document.querySelectorAll(\"#grouping button\").forEach(\n        (button) =>\n          (button.onclick = () => {\n            groupBy = button.dataset.group;\n            render();\n          }),\n      );\n      document.getElementById(\"search\").oninput = (e) => {\n        q = e.target.value;\n        render();\n      };\n      render();\n    \u003c/script>\n  \u003cscript>\n(function () {\n  const routes = /^(index|create|machines|analytics|settings)\\.html(?:[?#].*)?$/;\n  document.addEventListener('click', function (event) {\n    const anchor = event.target.closest('a[href]');\n    if (!anchor) return;\n    const href = anchor.getAttribute('href');\n    if (!href || !routes.test(href)) return;\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    parent.postMessage({ type: 'itest-navigate', href: href }, '*');\n  }, true);\n})();\u003c/script>\u003c/body>\n\u003c/html>\n","analytics.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cscript>window.__ITEST_QUERY__ = '__ITEST_ROUTE_QUERY__';\u003c/script>\u003cstyle>:root {\n  --bg: #f4f6f8;\n  --surface: #fff;\n  --surface-2: #f7f8fa;\n  --t  margin-left: auto;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n}\n.user-menu {\n  height: 36px;\n  border: 1px solid var(--border);\n  background: #fff;\n  border-radius: 7px;\n  padding: 0 10px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  color: #39445a;\n}\n.avatar {\n  width: 22px;\n  height: 22px;\n  border-radius: 50%;\n  background: #dbe8ff;\n  color: var(--blue);\n  display: grid;\n  place-items: center;\n  font-size: 11px;\n  font-weight: 750;\n}\n.icon-btn {\n  width: 36px;\n  height: 36px;\n  border: 1px solid var(--border);\n  background: #fff;\n  border-radius: 7px;\n  color: #536077;\n  display: grid;\n  place-items: center;\n}\n.icon-btn:hover {\n  border-color: var(--border-strong);\n  background: var(--surface-2);\n}\n.shell {\n  padding: 22px 26px 48px;\n  max-width: 1680px;\n  margin: 0 auto;\n}\n.page-title-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  margin-bottom: 18px;\n}\n.page-title h1 {\n  font-size: 25px;\n  line-height: 1.2;\n  margin: 0 0 5px;\n  letter-spacing: 0;\n  font-weight: 760;\n}\n.page-title p {\n  margin: 0;\n  color: var(--muted);\n}\n.btn {\n  height: 36px;\n  border: 1px solid var(--border-strong);\n  background: #fff;\n  border-radius: 6px;\n  padding: 0 13px;\n  color: #354158;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 7px;\n  font-weight: 600;\n}\n.btn:hover {\n  background: #f7f9fc;\n  border-color: #aeb6c2;\n}\n.btn.primary {\n  background: var(--blue);\n  border-color: var(--blue);\n  color: #fff;\n}\n.btn.primary:hover {\n  background: var(--blue-hover);\n}\n.btn.danger {\n  color: var(--red);\n  border-color: #efbfc3;\n}\n.btn.ghost {\n  border-color: transparent;\n  background: transparent;\n  color: var(--blue);\n}\n.btn.small {\n  height: 30px;\n  padding: 0 10px;\n  font-size: 12px;\n}\n.btn:disabled {\n  opacity: 0.45;\n  cursor: not-allowed;\n}\n.btn svg,\n.icon-btn svg {\n  width: 17px;\n  height: 17px;\n}\n.stats {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 10px;\n  margin-bottom: 12px;\n}\n.stat {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: 7px;\n  padding: 12px 14px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-height: 68px;\n  cursor: pointer;\n}\n.stat:hover {\n  border-color: #aebbd0;\n  box-shadow: 0 3px 10px rgba(22, 34, 55, 0.05);\n}\n.stat.active {\n  border-color: var(--blue);\n  box-shadow: inset 0 0 0 1px var(--blue);\n}\n.stat-label {\n  color: var(--muted);\n  font-size: 12px;\n}\n.stat-value {\n  font-size: 24px;\n  font-weight: 760;\n  margin-top: 1px;\n}\n.stat-dot {\n  width: 9px;\n  height: 9px;\n  border-radius: 50%;\n  background: var(--blue);\n}\n.stat[data-filter=\"running\"] .stat-dot {\n  background: var(--blue);\n}\n.stat[data-filter=\"checkin\"] .stat-dot {\n  background: var(--orange);\n}\n.stat[data-filter=\"pending\"] .stat-dot,\n.stat[data-filter=\"fault\"] .stat-dot {\n  background: var(--red);\n}\n.workspace {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  overflow: hidden;\n}\n.toolbar {\n  min-height: 58px;\n  padding: 10px 12px;\n  border-bottom: 1px solid var(--border);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n}\n.date-step {\n  display: flex;\n  align-items: center;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  overflow: hidden;\n}\n.date-step button {\n  width: 32px;\n  height: 34px;\n  border: 0;\n  background: #fff;\n  color: #4c566a;\n}\n.date-step button:hover {\n  background: var(--surface-2);\n}\n.date-step strong {\n  min-width: 178px;\n  text-align: center;\n  border-left: 1px solid var(--border);\n  border-right: 1px solid var(--border);\n  height: 34px;\n  line-height: 34px;\n}\n.today {\n  color: var(--blue);\n  font-size: 11px;\n  margin-left: 5px;\n}\n.seg {\n  display: flex;\n  background: #eef1f5;\n  padding: 3px;\n  border-radius: 6px;\n  gap: 2px;\n}\n.seg button {\n  height: 28px;\n  border: 0;\n  background: transparent;\n  color: #5a6577;\n  border-radius: 4px;\n  padding: 0 11px;\n  font-size: 12px;\n}\n.seg button.active {\n  background: #fff;\n  color: var(--blue);\n  box-shadow: 0 1px 4px rgba(30, 42, 66, 0.1);\n  font-weight: 650;\n}\n.toolbar-spacer {\n  flex: 1;\n}\n.search {\n  height: 34px;\n  width: 220px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: #fff;\n  padding: 0 10px;\n  outline: 0;\n}\n.search:focus,\n.field input:focus,\n.field select:focus,\n.field textarea:focus {\n  border-color: var(--blue);\n}\n.select {\n  height: 34px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: #fff;\n  padding: 0 27px 0 10px;\n  color: #465168;\n}\n.view-tabs {\n  display: flex;\n  border-bottom: 1px solid var(--border);\n  padding: 0 12px;\n  background: #fbfcfd;\n}\n.view-tabs button {\n  height: 42px;\n  border: 0;\n  background: transparent;\n  padding: 0 17px;\n  color: #5a6577;\n  border-bottom: 2px solid transparent;\n}\n.view-tabs button.active {\n  color: var(--blue);\n  border-bottom-color: var(--blue);\n  font-weight: 650;\n}\n.view-tabs button.permission {\n  margin-left: auto;\n  color: var(--green);\n}\n.gantt-wrap {\n  overflow: auto;\n}\n.gantt {\n  min-width: 1220px;\n}\n.gantt-head,\n.gantt-row {\n  display: grid;\n  grid-template-columns: 150px 1fr;\n}\n.gantt-head {\n  height: 50px;\n  background: #fafbfc;\n  border-bottom: 1px solid var(--border);\n  position: sticky;\n  top: 58px;\n  z-index: 6;\n}\n.machine-corner,\n.machine-label {\n  padding: 9px 12px;\n  border-right: 1px solid var(--border);\n}\n.machine-corner {\n  font-size: 12px;\n  color: var(--muted);\n  display: flex;\n  align-items: center;\n}\n.machine-label {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}\n.machine-label strong {\n  font-size: 13px;\n}\n.machine-label small {\n  color: var(--mu -section {\n  padding: 13px 14px 14px;\n  border: 1px solid var(--border);\n  border-radius: 7px;\n  background: #fafbfc;\n}\n.model-section-head {\n  margin-bottom: 10px;\n}\n.model-section-head h3 {\n  font-size: 14px;\n  margin: 1px 0 0;\n}\n.machine-card-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 10px;\n}\n.machine-card-grid .machine-card {\n  min-height: 180px;\n}\n.machine-card.unavailable {\n  background: #f1f3f5;\n  color: #697386;\n}\n.machine-code {\n  font-size: 10px;\n  color: var(--muted);\n}\n.machine-card-info {\n  display: grid;\n  grid-template-columns: 46px 1fr;\n  gap: 5px 9px;\n  margin: 12px 0 0;\n}\n.machine-card-info dt,\n.machine-card-info dd {\n  margin: 0;\n  font-size: 11px;\n}\n.machine-card-info dt {\n  color: var(--muted);\n}\n.machine-card-info dd {\n  font-weight: 600;\n}\n.machine-card-grid .machine-card .next {\n  margin-top: 12px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\u003c/style>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>数据分析 · iTest\u003c/title>\n\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"shell\">\n  \u003cdiv class=\"page-title-row\">\n    \u003cdiv class=\"page-title\">\u003ch1>数据分析\u003c/h1>\u003cp>查看部门与机台的资源使用情况，并下钻到使用人和工单。\u003c/p>\u003c/div>\n    \u003cselect class=\"select\" id=\"range\">\u003coption value=\"today\">今日\u003c/option>\u003coption value=\"week\">本周\u003c/option>\u003coption value=\"month\">本月\u003c/option>\u003c/select>\n  \u003c/div>\n\n  \u003cdiv class=\"grid-3\" id=\"metrics\" style=\"grid-template-columns:repeat(4,1fr);margin-bottom:12px\">\u003c/div>\n\n  \u003csection class=\"panel department-usage-panel\">\n    \u003cdiv class=\"panel-head\">\n      \u003cdiv>\u003ch2>部门机台使用\u003c/h2>\u003cdiv class=\"cell-sub\">今日 · 24 小时排程口径，点击部门查看机台、使用人及工单\u003c/div>\u003c/div>\n      \u003cdiv class=\"usage-legend\">\u003cspan>\u003ci class=\"run\">\u003c/i>Run\u003c/span>\u003cspan>\u003ci class=\"other\">\u003c/i>其他部门占用\u003c/span>\u003cspan>\u003ci class=\"idle\">\u003c/i>Idle\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel-body\">\n      \u003cdiv class=\"department-usage-head\">\u003cspan>部门 / 涉及机台\u003c/span>\u003cspan>机台池时长构成\u003c/span>\u003cspan>Run\u003c/span>\u003cspan>其他占用\u003c/span>\u003cspan>Idle\u003c/span>\u003cspan>使用人\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv class=\"department-usage-list\" id=\"department-usage\">\u003c/div>\n      \u003cdiv class=\"analytics-method\">说明：Run 为该部门今日已排工单时长；Idle 为该部门今日涉及机台扣除所有部门排程后的空闲时长。同一共享机台可能出现在多个部门视图中，因此部门 Idle 不用于跨部门加总。\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"grid-2\">\n    \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>机台利用率\u003c/h2>\u003ca class=\"btn ghost small\" href=\"index.html\">查看排程 →\u003c/a>\u003c/div>\u003cdiv class=\"panel-body bar-list\" id=\"machine-bars\">\u003c/div>\u003c/section>\n    \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>工单状态\u003c/h2>\u003ca class=\"btn ghost small\" href=\"index.html\">查看工单 →\u003c/a>\u003c/div>\u003cdiv class=\"panel-body bar-list\" id=\"status-bars\">\u003c/div>\u003c/section>\n    \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>部门白班配额\u003c/h2>\u003c/div>\u003cdiv class=\"panel-body bar-list\" id=\"quota-bars\">\u003c/div>\u003c/section>\n    \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>占机治理效果\u003c/h2>\u003c/div>\u003cdiv class=\"panel-body\" id=\"guard\">\u003c/div>\u003c/section>\n  \u003c/div>\n\u003c/main>\n\n\u003cscript>/* ============================================================\n   iTest 智能排测系统 — shared mock data + state layer\n   Persisted to localStorage so edits flow across pages.\n   Time model: timeline offset 0 = 08:00; 1440 min span = 08:00→next 08:00\n     Day shift   白班 : offset    0 – 720   (08:00 – 20:00)\n     Night shift 夜班 : offset  720 – 1440  (20:00 – 08:00)\n   ============================================================ */\n(function (global) {\n  const KEY = 'itest-state-v7';\n\n  // simulated \"current time\": 14:40 → day shift in progress\n  const NOW_MIN = 400;\n\n  // 中国大陆法定节假日日历（2026，自动同步，无需人工维护）\n  const CN_HOLIDAYS = [\n    '2026-01-01',                                                                                       // 元旦\n    '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22',         // 春节\n    '2026-04-04','2026-04-05','2026-04-06',                                                             // 清明\n    '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',                                   // 劳动节\n    '2026-06-19','2026-06-20','2026-06-21',                                                             // 端午\n    '2026-09-25','2026-09-26','2026-09-27',                                                             // 中秋\n    '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08', // 国庆\n  ];\n  // 调休上班日（落在周末但需上班）\n  const CN_MAKEUP_WORKDAYS = ['2026-02-14', '2026-02-15', '2026-04-26', '2026-10-10'];\n\n  const SEED = {\n    nowMin: NOW_MIN,\n    today: '2026-06-10',\n    meta: {\n      // PE manager: one priority bump per day, for a single task\n      managerAdjustUsed: false,\n      managerAdjustTask: null,\n      noShowToday: 1,          // 白班未签到被自动释放次数（恶性占机治理埋点）\n      autoReleased: ['T-1009'],\n    },\n    // 部门：优先级(rank 越小越高) + 每日白班机时配额(分钟，仅白天计)\n    departments: [\n      { name: '研发一部', rank: 1, dailyQuotaMin: 600 },\n      { name: '研发二部', rank: 2, dailyQuotaMin: 480 },\n      { name: '研发三部', rank: 3, dailyQuotaMin: 360 },\n    ],\n    config: { checkinGraceMin: 15, leadDays: 3 },   // 签到宽限期 / 预约提前量(当天~T+3)\n    // 借机规则：周一至周五 × 机台 的「优先预约部门」单元格（Lab 维护，不定期更新）\n    // 每条 = 一个 (机台, 星期) 单元格，depts 为该格拥有优先权的部门集合（可多个共享）。\n    borrowRules: [\n      { id: 'BR-1',  machine: 'ICT-A',   weekday: '周一', depts: ['研发一部'],          note: '主板 ICT 量产优先窗口' },\n      { id: 'BR-2',  machine: 'ICT-A',   weekday: '周二', depts: ['研发一部','研发二部'], note: '两部门共享，按部门优先级排队' },\n      { id: 'BR-3',  machine: 'ICT-A',   weekday: '周三', depts: ['研发二部'],          note: '' },\n      { id: 'BR-4',  machine: 'ICT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-5',  machine: 'ICT-A',   weekday: '周五', depts: ['研发三部'],          note: '周末前补测' },\n      { id: 'BR-6',  machine: 'ICT-B',   weekday: '周一', depts: ['研发一部'],          note: '' },\n      { id: 'BR-7',  machine: 'ICT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-8',  machine: 'ICT-B',   weekday: '周三', depts: ['研发一部','研发三部'], note: '' },\n      { id: 'BR-9',  machine: 'ICT-B',   weekday: '周五', depts: ['研发一部'],          note: '' },\n      { id: 'BR-10', machine: 'FCT-A',   weekday: '周一', depts: ['研发一部','研发三部'], note: '共享窗口' },\n      { id: 'BR-11', machine: 'FCT-A',   weekday: '周二', depts: ['研发三部'],          note: '整机功能测试' },\n      { id: 'BR-12', machine: 'FCT-A',   weekday: '周四', depts: ['研发二部'],          note: '' },\n      { id: 'BR-13', machine: 'FCT-A',   weekday: '周五', depts: ['研发二部'],          note: '' },\n      { id: 'BR-14', machine: 'FCT-B',   weekday: '周二', depts: ['研发二部'],          note: '' },\n      { id: 'BR-15', machine: 'RF-01',   weekday: '周一', depts: ['研发三部'],          note: '周一上午校准，期间不可约' },\n      { id: 'BR-16', machine: 'RF-01',   weekday: '周二', depts: ['研发三部'],          note: '' },\n      { id: 'BR-17', machine: 'RF-01',   weekday: '周三', depts: ['研发一部','研发二部','研发三部'], note: '射频公共窗口，三部门共享' },\n      { id: 'BR-18', machine: 'RF-01',   weekday: '周四', depts: ['研发一部'],          note: '' },\n      { id: 'BR-19', machine: 'BURN-01', weekday: '周一', depts: ['研发二部'],          note: '' },\n      { id: 'BR-20', machine: 'BURN-01', weekday: '周四', depts: ['研发一部'],          note: '老化测试排程' },\n      { id: 'BR-21', machine: 'BURN-01', weekday: '周五', depts: ['研发三部'],          note: '' },\n    ],\n    // 机台零部件 / 治具说明：供 PE 预约前参考（Lab 维护，不定期更新）\n    machineParts: [\n      { id: 'MP-1', machine: 'ICT-A',   part: '飞针探针卡 Probe-A',         spec: 'Apollo / Orion 主板（≤ 6 层）', note: '探针寿命约 80%，大批量测试前建议更换' },\n      { id: 'MP-2', machine: 'ICT-B',   part: '针床治具 Bed-of-Nails B2',   spec: 'Vega 子板',                    note: '仅支持 1.27mm 间距测试点' },\n      { id: 'MP-3', machine: 'FCT-A',   part: '功能夹具 FX-12 + 24V 负载',  spec: 'Nova 整机 / Orion 模组',        note: '需配 24V 电源模块' },\n      { id: 'MP-4', machine: 'FCT-B',   part: '探针更换中',                 spec: '—',                            note: '保养中，预计 18:00 恢复' },\n      { id: 'MP-5', machine: 'RF-01',   part: '射频屏蔽箱 + 矢网校准件',     spec: 'Pulsar 射频板（Sub-6GHz）',     note: '每周一上午校准，校准期间不可预约' },\n      { id: 'MP-6', machine: 'BURN-01', part: '高低温老化箱 + 温度探头 ×8', spec: 'Quasar 电源板',                 note: '压缩机故障维修中，暂停排测' },\n    ],\n    machines: [\n      { id: 'M-01', name: 'ICT-A',  type: 'ICT 在线测试',  lab: 'A区·01', status: 'idle',        owner: '—',        note: '' },\n      { id: 'M-02', name: 'ICT-B',  type: 'ICT 在线测试',  lab: 'A区·02', status: 'running',     owner: '陈明',     note: '正在执行 T-1004' },\n      { id: 'M-03', name: 'FCT-A',  type: 'FCT 功能测试',  lab: 'A区·05', status: 'running',     owner: '王伟',     note: '正在执行 T-1006' },\n      { id: 'M-04', name: 'FCT-B',  type: 'FCT 功能测试',  lab: 'A区·06', status: 'maintenance', owner: '设备组',   note: '探针更换保养，预计 18:00 恢复' },\n      { id: 'M-05', name: 'RF-01',  type: '射频测试',      lab: 'B区·11', status: 'idle',        owner: '—',        note: '' },\n      { id: 'M-06', name: 'BURN-01',type: '老化测试',      lab: 'B区·14', status: 'fault',       owner: '设备组',   note: '温箱压缩机异常，待维修，暂停排测' },\n    ],\n    tasks: [\n      // ---------- 白班 day shift ----------\n      { id: 'T-1001', shift: 'day',   machine: 'M-01', start: 0,   end: 120, status: 'done',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 120, note: '良率 99.2%，已上传报告' },\n      { id: 'T-1002', shift: 'day',   machine: 'M-01', start: 150, end: 330, status: 'done',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'mid', est: 180, note: '' },\n      { id: 'T-1003', shift: 'day',   machine: 'M-02', start: 60,  end: 240, status: 'done',\n        pe: '张涛', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'low', est: 180, note: '' },\n      { id: 'T-1004', shift: 'day',   machine: 'M-02', start: 270, end: 510, status: 'running',\n        pe: '陈明', dept: '研发二部', product: 'Apollo 主板', type: 'ICT', prio: 'high', est: 240, note: '' },\n      { id: 'T-1005', shift: 'day',   machine: 'M-03', start: 30,  end: 360, status: 'done',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'mid', est: 330, note: '' },\n      { id: 'T-1006', shift: 'day',   machine: 'M-03', start: 360, end: 600, status: 'running',\n        pe: '王伟', dept: '研发一部', product: 'Orion 模组', type: 'FCT', prio: 'high', est: 240, note: '' },\n      { id: 'T-1007', shift: 'day',   machine: 'M-05', start: 420, end: 600, status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'mid', est: 180, source: 'self', checkedIn: false, note: '' },\n      { id: 'T-1008', shift: 'day',   machine: 'M-01', start: 480, end: 600, status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 120, source: 'self', checkedIn: false, note: '白班自助预约 · 待签到（16:00）' },\n\n      // ---------- 夜班 night shift（PE 白班提交，Lab 工程师夜间执行）----------\n      { id: 'T-2001', shift: 'night', machine: 'M-01', start: 720,  end: 900,  status: 'scheduled',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'high', est: 180, note: '' },\n      { id: 'T-2002', shift: 'night', machine: 'M-01', start: 930,  end: 1110, status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 180, note: '' },\n      { id: 'T-2003', shift: 'night', machine: 'M-02', start: 750,  end: 1020, status: 'scheduled',\n        pe: '陈明', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'mid', est: 270, note: '' },\n      { id: 'T-2004', shift: 'night', machine: 'M-03', start: 780,  end: 1200, status: 'scheduled',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'high', est: 420, note: '夜间长时间老化+功能复测' },\n      { id: 'T-2005', shift: 'night', machine: 'M-05', start: 720,  end: 1140, status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'low', est: 420, note: '' },\n\n      // ---------- 待排程 pending（智能算法待规划 / 机台不可用导致挂起）----------\n      { id: 'T-2006', shift: 'night', machine: null, start: null, end: null, status: 'pending',\n        pe: '张涛', dept: '研发二部', product: 'Quasar 电源板', type: '老化', prio: 'mid', est: 360, note: 'BURN-01 故障，等待机台恢复或改派' },\n      { id: 'T-2007', shift: 'day',   machine: null, start: null, end: null, status: 'pending',\n        pe: '周琳', dept: '研发三部', product: 'Comet 传感模组', type: 'FCT', prio: 'high', est: 150, note: '今日新提交，待算法插入白班空档' },\n\n      // ---------- 明日规划 day +1（算法已提前排好）----------\n      { id: 'T-1101', day: 1, shift: 'day',   machine: 'M-01', start: 60,  end: 210,  status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'mid', est: 150, note: '明日首件复测' },\n      { id: 'T-1102', day: 1, shift: 'day',   machine: 'M-02', start: 30,  end: 240,  status: 'scheduled',\n        pe: '李娜', dept: '研发一部', product: 'Orion 模组', type: 'ICT', prio: 'high', est: 210, note: '' },\n      { id: 'T-1103', day: 1, shift: 'day',   machine: 'M-03', start: 120, end: 420,  status: 'scheduled',\n        pe: '刘洋', dept: '研发一部', product: 'Nova 整机', type: 'FCT', prio: 'mid', est: 300, note: '' },\n      { id: 'T-1104', day: 1, shift: 'day',   machine: 'M-05', start: 300, end: 480,  status: 'scheduled',\n        pe: '赵敏', dept: '研发三部', product: 'Pulsar 射频板', type: 'RF', prio: 'low', est: 180, note: '' },\n      { id: 'T-2101', day: 1, shift: 'night', machine: 'M-01', start: 720, end: 960,  status: 'scheduled',\n        pe: '王伟', dept: '研发一部', product: 'Apollo 主板', type: 'ICT', prio: 'high', est: 240, note: '夜间老化 + 功能复测' },\n      { id: 'T-2102', day: 1, shift: 'night', machine: 'M-03', start: 780, end: 1140, status: 'scheduled',\n        pe: '陈明', dept: '研发二部', product: 'Vega 子板', type: 'ICT', prio: 'mid', est: 360, note: '' },\n    ],\n  };\n\n  // ---- persistence ----\n  function clone(o) { return JSON.parse(JSON.stringify(o)); }\n  function load() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) return JSON.parse(raw);\n    } catch (e) {}\n    const s = clone(SEED);\n    save(s);\n    return s;\n  }\n  function save(s) {\n    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}\n  }\n  // next sequential id for an editable sheet row, e.g. rowId('BR', rules) → 'BR-5'\n  function rowId(prefix, arr) {\n    let n = 0;\n    arr.forEach(r => { const m = /(\\d+)$/.exec(r.id || ''); if (m) n = Math.max(n, +m[1]); });\n    return prefix + '-' + (n + 1);\n  }\n\n  let state = load();\n\n  // ---- helpers ----\n  function minToClock(offset) {\n    if (offset == null) return '—';\n    let total = 480 + offset;\n    const h = Math.floor(total / 60) % 24;\n    const m = total % 60;\n    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');\n  }\n  function fmtDur(min) {\n    if (min == null) return '—';\n    const h = Math.floor(min / 60), m = min % 60;\n    return (h ? h + 'h' : '') + (m ? m + 'min' : (h ? '' : '0min'));\n  }\n  // date label for a day-offset relative to the simulated \"today\" (state.today)\n  function dateLabel(offset) {\n    const base = new Date(state.today + 'T00:00:00');\n    const d = new Date(base.getTime() + offset * 86400000);\n    const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];\n    const text = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n    return { text, wd, isToday: offset === 0 };\n  }\n  function dayName(offset) {\n    return offset === 0 ? '今天' : offset === 1 ? '明天' : offset === -1 ? '昨天'\n         : (offset > 0 ? '+' + offset + '天' : offset + '天');\n  }\n\n  const STATUS_META = {\n    pending:   { label: '待排程',  cls: 'neutral' },\n    scheduled: { label: '已排程',  cls: 'info' },\n    running:   { label: '测试中',  cls: 'running' },\n    done:      { label: '已完成',  cls: 'ok' },\n    hold:      { label: '已挂起',  cls: 'warn' },\n    fail:      { label: '测试异常', cls: 'danger' },\n  };\n  const MACHINE_STATUS = {\n    idle:        { label: '空闲',   cls: 'ok',      schedulable: true  },\n    running:     { label: '运行中', cls: 'running', schedulable: true  },\n    maintenance: { label: '保养中', cls: 'warn',    schedulable: false },\n    fault:       { label: '故障',   cls: 'danger',  schedulable: false },\n  };\n  const PRIO_META = {\n    high: { label: '高', cls: 'p-high', rank: 0 },\n    mid:  { label: '中', cls: 'p-mid',  rank: 1 },\n    low:  { label: '低', cls: 'p-low',  rank: 2 },\n  };\n\n  const Store = {\n    get state() { return state; },\n    get machines() { return state.machines; },\n    get tasks() { return state.tasks; },\n    nowMin: () => state.nowMin,\n    today: () => state.today,\n\n    machine(id) { return state.machines.find(m => m.id === id); },\n    task(id) { return state.tasks.find(t => t.id === id); },\n    tasksByShift(shift) { return state.tasks.filter(t => t.shift === shift); },\n    schedulableMachines() { return state.machines.filter(m => MACHINE_STATUS[m.status].schedulable); },\n\n    setMachineStatus(id, status, note) {\n      const m = this.machine(id);\n      if (!m) return;\n      m.status = status;\n      if (note != null) m.note = note;\n      save(state);\n    },\n    setTaskStatus(id, status, note) {\n      const t = this.task(id);\n      if (!t) return;\n      t.status = status;\n      if (note != null) t.note = note;\n      save(state);\n    },\n    setTaskMachine(id, machine) {\n      const t = this.task(id);\n      if (!t) return;\n      t.machine = machine;\n      t.moved = true;\n      save(state);\n    },\n    setTaskPrio(id, prio) {\n      const t = this.task(id);\n      if (!t) return;\n      t.prio = prio;\n      save(state);\n    },\n    addTask(t) {\n      state.tasks.push(t);\n      save(state);\n    },\n    updateTask(id, fields) {\n      const t = this.task(id);\n      if (!t) return;\n      Object.assign(t, fields);\n      save(state);\n    },\n    removeTask(id) {\n      const i = state.tasks.findIndex(t => t.id === id);\n      if (i >= 0) state.tasks.splice(i, 1);\n      save(state);\n    },\n    // 智能排测算法（原型）：清空原占位，按班次/当天找最早空档重新分配。\n    // 工程师无法指定机台或时间 —— 每次编辑都会重排，从机制上杜绝提前占位。\n    autoSchedule(id) {\n      const t = this.task(id);\n      if (!t) return null;\n      const day = t.day || 0;\n      const [lo, hi] = this.SHIFT_RANGE[t.shift];\n      // release current placement first\n      t.machine = null; t.start = null; t.end = null;\n      let best = null;\n      for (const m of this.schedulableMachines()) {\n        const occ = state.tasks.filter(x => x.id !== id && x.machine === m.id && x.start != null\n                      && (x.day || 0) === day && x.shift === t.shift).sort((a, b) => a.start - b.start);\n        let cursor = lo;\n        if (day === 0 && t.shift === 'day') cursor = Math.max(cursor, state.nowMin); // 不排到过去\n        for (const o of occ) { if (o.start - cursor >= t.est) break; cursor = Math.max(cursor, o.end); }\n        if (cursor + t.est \u003c= hi && (!best || cursor \u003c best.start)) best = { machine: m.id, start: cursor };\n      }\n      if (best) { t.machine = best.machine; t.start = best.start; t.end = best.start + t.est; t.status = 'scheduled'; }\n      else { t.status = 'pending'; }\n      save(state);\n      return best;\n    },\n    useManagerAdjust(taskId) {\n      state.meta.managerAdjustUsed = true;\n      state.meta.managerAdjustTask = taskId;\n      save(state);\n    },\n\n    // ---- departments / quota (白班借机配额，仅白天计) ----\n    get departments() { return state.departments; },\n    department(name) { return state.departments.find(d => d.name === name); },\n    quotaUsedMin(deptName, day) {\n      day = day || 0;\n      return state.tasks\n        .filter(t => t.dept === deptName && t.shift === 'day' && (t.day || 0) === day && t.machine && t.start != null)\n        .reduce((a, t) => a + (t.end - t.start), 0);\n    },\n    setDeptQuota(name, fields) {\n      const d = this.department(name);\n      if (d) { Object.assign(d, fields); save(state); }\n    },\n\n    // ---- 借机规则 / 机台零部件说明（Lab 工程师维护，像表格一样增删改）----\n    get borrowRules() { return state.borrowRules; },\n    addBorrowRule(row) { state.borrowRules.push(Object.assign({ id: rowId('BR', state.borrowRules) }, row)); save(state); },\n    updateBorrowRule(id, fields) { const r = state.borrowRules.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeBorrowRule(id) { const i = state.borrowRules.findIndex(x => x.id === id); if (i >= 0) { state.borrowRules.splice(i, 1); save(state); } },\n    // 借机规则 — 按 (机台, 星期) 单元格读写；depts 为部门集合（可多部门共享）\n    borrowRuleFor(machine, weekday) { return state.borrowRules.find(r => r.machine === machine && r.weekday === weekday); },\n    toggleBorrowDept(machine, weekday, dept) {\n      if (!dept) return;\n      let r = this.borrowRuleFor(machine, weekday);\n      if (!r) { state.borrowRules.push({ id: rowId('BR', state.borrowRules), machine, weekday, depts: [dept], note: '' }); save(state); return; }\n      const i = r.depts.indexOf(dept);\n      if (i >= 0) { r.depts.splice(i, 1); if (r.depts.length === 0) state.borrowRules.splice(state.borrowRules.indexOf(r), 1); }\n      else { r.depts.push(dept); }\n      save(state);\n    },\n    clearBorrow(machine, weekday) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { state.borrowRules.splice(state.borrowRules.indexOf(r), 1); save(state); }\n    },\n    setBorrowNote(machine, weekday, note) {\n      const r = this.borrowRuleFor(machine, weekday);\n      if (r) { r.note = note; save(state); }\n    },\n    get machineParts() { return state.machineParts; },\n    addMachinePart(row) { state.machineParts.push(Object.assign({ id: rowId('MP', state.machineParts) }, row)); save(state); },\n    updateMachinePart(id, fields) { const r = state.machineParts.find(x => x.id === id); if (r) { Object.assign(r, fields); save(state); } },\n    removeMachinePart(id) { const i = state.machineParts.findIndex(x => x.id === id); if (i >= 0) { state.machineParts.splice(i, 1); save(state); } },\n\n    // ---- 节假日日历（已与中国大陆法定节假日同步，自动更新，无需人工维护）----\n    dateKind(dateText) {\n      if (CN_MAKEUP_WORKDAYS.includes(dateText)) return 'makeup';   // 调休上班\n      if (CN_HOLIDAYS.includes(dateText)) return 'holiday';         // 法定节假日\n      const dow = new Date(dateText + 'T00:00:00').getDay();\n      return (dow === 0 || dow === 6) ? 'weekend' : 'workday';\n    },\n    isHoliday(dateText) { const k = this.dateKind(dateText); return k === 'holiday' || k === 'weekend'; },\n    // 某天某时段的执行模式：工作日白班=自助预约；夜间/周末/节假日=算法+Lab 代测\n    mode(dayOffset, shift) {\n      const kind = this.dateKind(dateLabel(dayOffset).text);\n      if (kind === 'holiday') return { kind: 'algo', exec: 'lab', label: '节假日·算法代测' };\n      if (kind === 'weekend') return { kind: 'algo', exec: 'lab', label: '周末·算法代测' };\n      if (shift === 'day') return { kind: 'self', exec: 'pe', label: '工作日白班·自助预约' };\n      return { kind: 'algo', exec: 'lab', label: '工作日夜班·算法代测' };\n    },\n\n    // ---- daytime reservation check-in ----\n    checkIn(id) { const t = this.task(id); if (t) { t.checkedIn = true; t.status = 'running'; save(state); } },\n    checkOut(id, note) { const t = this.task(id); if (t) { t.status = 'done'; if (note != null) t.note = note; save(state); } },\n\n    // ---- role layer (role is now a filter, not a nav axis) ----\n    ROLES: {\n      pe:      { key: 'pe',      label: 2\"/>\u003c/svg>'\n  };\n  const NAV=[['index.html','排测中心'],['machines.html','机台'],['analytics.html','数据分析'],['settings.html','设置']];\n  function mount(active){\n    const role=S.role();\n    document.body.insertAdjacentHTML('afterbegin',`\u003caside class=\"topbar\">\u003cdiv class=\"topbar-inner\">\n      \u003ca class=\"brand\" href=\"index.html\">\u003cspan class=\"brand-mark\">iT\u003c/span>\u003cspan>iTest 智能排测\u003c/span>\u003c/a>\n      \u003cnav class=\"nav\">${NAV.map(n=>`\u003ca class=\"${active===n[0]?'active':''}\" href=\"${n[0]}\">${n[1]}\u003c/a>`).join('')}\u003c/nav>\n      \u003cdiv class=\"top-actions\">\u003cbutton class=\"icon-btn\" title=\"通知\">◉\u003c/button>\u003clabel class=\"user-menu\" title=\"原型演示身份\">\u003cspan class=\"avatar\">${role.who.slice(0,1)}\u003c/span>\u003cselect id=\"demo-role\" style=\"border:0;background:transparent;outline:0\">\u003coption value=\"pe\" ${role.key==='pe'?'selected':''}>王伟 · PE\u003c/option>\u003coption value=\"manager\" ${role.key==='manager'?'selected':''}>主管 · 管理者\u003c/option>\u003coption value=\"lab\" ${role.key==='lab'?'selected':''}>黄工 · Lab\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n    \u003c/div>\u003c/aside>`);\n    document.getElementById('demo-role').addEventListener('change',e=>{S.setRole(e.target.value);location.reload()});\n  }\n  function status(t){const m=S.STATUS_META[t.status];return `\u003cspan class=\"status ${t.status}\">\u003ci>\u003c/i>${m.label}\u003c/span>`}\n  function priority(t){const m=S.PRIO_META[t.prio];return `\u003cspan class=\"priority ${t.prio}\">${m.label}\u003c/span>`}\n  function machineName(t){return t.machine?(S.machine(t.machine)?.name||t.machine):'待分配'}\n  function toast(text,kind='success'){\n    let wrap=document.querySelector('.toast-wrap');if(!wrap){wrap=document.createElement('div');wrap.className='toast-wrap';document.body.appendChild(wrap)}\n    const el=document.createElement('div');el.className='toast '+kind;el.textContent=text;wrap.appendChild(el);setTimeout(()=>el.remove(),2600);\n  }\n  function ensureDrawer(){\n    if(document.getElementById('drawer'))return;\n    document.body.insertAdjacentHTML('beforeend','\u003cdiv class=\"drawer-mask\" id=\"drawer-mask\">\u003c/div>\u003caside class=\"drawer\" id=\"drawer\">\u003cdiv id=\"drawer-content\">\u003c/div>\u003c/aside>');\n    document.getElementById('drawer-mask').addEventListener('click',closeDrawer);\n    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});\n  }\n  function openDrawer(html){ensureDrawer();document.getElementById('drawer-content').innerHTML=html;document.getElementById('drawer').classList.add('open');document.getElementById('drawer-mask').classList.add('open');document.querySelectorAll('[data-close-drawer]').forEach(b=>b.addEventListener('click',closeDrawer))}\n  function closeDrawer(){document.getElementById('drawer')?.classList.remove('open');document.getElementById('drawer-mask')?.classList.remove('open')}\n  function taskDrawer(t,onChange){\n    const role=S.role();const own=t.pe===S.CURRENT_PE;const m=t.machine?S.machine(t.machine):null;\n    const actions=[];\n    if(role.key==='pe'&&own&&t.shift==='day'&&t.status==='scheduled'&&t.checkedIn===false)actions.push('\u003cbutton class=\"btn primary\" data-action=\"checkin\">到点签到\u003c/button>');\n    if(role.key==='pe'&&own&&['pending','scheduled'].includes(t.status))actions.push('\u003cbutton class=\"btn\" data-action=\"edit\">编辑工单\u003c/button>');\n    if(role.key==='manager'&&!S.state.meta.managerAdjustUsed&&t.prio!=='high'&&['pending','scheduled'].includes(t.status))actions.push('\u003cbutton class=\"btn primary\" data-action=\"bump\">提优\u003c/button>');\n    if(role.key==='lab'&&t.shift==='night')actions.push('\u003cbutton class=\"btn primary\" data-action=\"start\">'+(t.status==='running'?'完成测试':'开始测试')+'\u003c/button>\u003cbutton class=\"btn\" data-action=\"reassign\">改派机台\u003c/button>');\n    openDrawer(`\u003cdiv class=\"drawer-head\">\u003cdiv>\u003ch2>${t.id}\u003c/h2>\u003cdiv class=\"muted\">工单详情\u003c/div>\u003c/div>\u003cbutton class=\"icon-btn\" data-close-drawer>${I.close}\u003c/button>\u003c/div>\n      \u003cdiv class=\"drawer-body\">\u003cdiv class=\"detail-hero\">\u003cstrong>${t.product}\u003c/strong>\u003cspan class=\"muted\">${t.type} · ${t.pe} · ${t.dept}\u003c/span>\u003c/div>\n      \u003cdl class=\"kv\">\u003cdt>状态\u003c/dt>\u003cdd>${status(t)}\u003c/dd>\u003cdt>日期/班次\u003c/dt>\u003cdd>${S.dateLabel(t.day||0).text} · ${t.shift==='day'?'白班':'夜班'}\u003c/dd>\u003cdt>机台\u003c/dt>\u003cdd>${m?m.name+' · '+m.lab:'待算法分配'}\u003c/dd>\u003cdt>计划时间\u003c/dt>\u003cdd>${t.start!=null?S.minToClock(t.start)+'–'+S.minToClock(t.end):'待规划'}\u003c/dd>\u003cdt>预估时长\u003c/dt>\u003cdd>${S.fmtDur(t.est)}\u003c/dd>\u003cdt>优先级\u003c/dt>\u003cdd>${priority(t)}\u003c/dd>\u003cdt>备注\u003c/dt>\u003cdd>${t.note||'—'}\u003c/dd>\u003c/dl>\n      \u003ch3 class=\"section-title\">进度记录\u003c/h3>\u003cdiv class=\"timeline-list\">\u003cdiv class=\"timeline-item\">\u003cb>工单已提交\u003c/b>\u003cspan>申请人 ${t.pe}\u003c/span>\u003c/div>\u003cdiv class=\"timeline-item\">\u003cb>${t.machine?'系统已完成排程':'等待可用机台'}\u003c/b>\u003cspan>${t.machine?machineName(t)+' · '+S.minToClock(t.start):'系统将持续尝试排入空档'}\u003c/span>\u003c/div>${t.moved?'\u003cdiv class=\"timeline-item\">\u003cb>Lab 已现场改派\u003c/b>\u003cspan>当前机台 '+machineName(t)+'\u003c/span>\u003c/div>':''}\u003c/div>\u003c/div>\n      \u003cdiv class=\"drawer-foot\">\u003cbutton class=\"btn\" data-close-drawer>关闭\u003c/button>${actions.join('')}\u003c/div>`);\n    const done=()=>{closeDrawer();onChange&&onChange()};\n    document.querySelector('[data-action=\"checkin\"]')?.addEventListener('click',()=>{S.checkIn(t.id);toast('签到成功，测试已开始');done()});\n    document.querySelector('[data-action=\"bump\"]')?.addEventListener('click',()=>{S.setTaskPrio(t.id,t.prio==='low'?'mid':'high');S.useManagerAdjust(t.id);toast('已提优，排程视图已更新');done()});\n    document.querySelector('[data-action=\"start\"]')?.addEventListener('click',()=>{S.setTaskStatus(t.id,t.status==='running'?'done':'running');toast(t.status==='done'?'测试完成，已反馈 PE':'测试已开始');done()});\n    document.querySelector('[data-action=\"edit\"]')?.addEventListener('click',()=>{toast('编辑入口已统一收口到工单详情');});\n    document.querySelector('[data-action=\"reassign\"]')?.addEventListener('click',()=>{const target=S.schedulableMachines().find(x=>x.id!==t.machine);if(target){S.setTaskMachine(t.id,target.id);toast('已改派至 '+target.name);done()}});\n  }\n  global.V2App={I,mount,status,priority,machineName,toast,openDrawer,closeDrawer,taskDrawer};\n})(window);\n\u003c/script>\n\u003cscript>\n  V2App.mount('analytics.html');\n\n  const DAY_MINUTES = 1440;\n  const tasks = Store.tasks;\n  const machines = Store.machines;\n  const placedTasks = tasks.filter(task => task.machine && task.start != null && task.end != null && (task.day || 0) === 0);\n\n  function taskMinutes(task) {\n    return Math.max(0, Math.min(DAY_MINUTES, task.end) - Math.max(0, task.start));\n  }\n\n  function formatMinutes(minutes) {\n    return Store.fmtDur(Math.round(minutes));\n  }\n\n  function departmentNames() {\n    const configured = Store.departments.map(department => department.name);\n    const fromTasks = placedTasks.map(task => task.dept).filter(Boolean);\n    return [...new Set([...configured, ...fromTasks])];\n  }\n\n  function machineUsage(machineId, departmentName) {\n    const machineTasks = placedTasks.filter(task => task.machine === machineId);\n    const departmentTasks = machineTasks.filter(task => task.dept === departmentName);\n    const run = departmentTasks.reduce((total, task) => total + taskMinutes(task), 0);\n    const totalRun = machineTasks.reduce((total, task) => total + taskMinutes(task), 0);\n    return {\n      machine: Store.machine(machineId),\n      tasks: departmentTasks,\n      run,\n      other: Math.max(0, totalRun - run),\n      idle: Math.max(0, DAY_MINUTES - totalRun),\n    };\n  }\n\n  function departmentUsage(departmentName) {\n    const departmentTasks = placedTasks.filter(task => task.dept === departmentName);\n    const machineIds = [...new Set(departmentTasks.map(task => task.machine))];\n    const machineRows = machineIds.map(machineId => machineUsage(machineId, departmentName));\n    const people = [...new Set(departmentTasks.map(task => task.pe).filter(Boolean))];\n    const run = machineRows.reduce((total, row) => total + row.run, 0);\n    const other = machineRows.reduce((total, row) => total + row.other, 0);\n    const idle = machineRows.reduce((total, row) => total + row.idle, 0);\n    const capacity = machineIds.length * DAY_MINUTES;\n    return {\n      name: departmentName,\n      tasks: departmentTasks,\n      machines: machineRows,\n      people,\n      run,\n      other,\n      idle,\n      capacity,\n      share: capacity ? Math.round(run / capacity * 100) : 0,\n    };\n  }\n\n  const departmentRows = departmentNames().map(departmentUsage);\n  const busyMinutes = placedTasks.reduce((total, task) => total + taskMinutes(task), 0);\n  const schedulableMachines = Store.schedulableMachines().length;\n  const utilization = Math.round(busyMinutes / Math.max(1, schedulableMachines * DAY_MINUTES) * 100);\n  const doneTasks = tasks.filter(task => task.status === 'done').length;\n  const completion = Math.round(doneTasks / Math.max(1, tasks.length) * 100);\n\n  const metricCards = [\n    ['机台综合利用率', utilization + '%', '今日 Run ' + formatMinutes(busyMinutes)],\n    ['Case 完成率', completion + '%', '已完成 ' + doneTasks + ' 单'],\n    ['爽约自动释放', Store.state.meta.noShowToday || 0, '机台已回收到资源池'],\n    ['现场改派', tasks.filter(task => task.moved).length, 'Lab 处理异常排程'],\n  ];\n  document.getElementById('metrics').innerHTML = metricCards.map(card => `\u003cdiv class=\"metric\">\u003cspan>${card[0]}\u003c/span>\u003cstrong>${card[1]}\u003c/strong>\u003cdiv class=\"cell-sub\">${card[2]}\u003c/div>\u003c/div>`).join('');\n\n  function usageStack(row) {\n    if (!row.capacity) return '\u003cdiv class=\"usage-stack empty\">\u003cspan>今日暂无机台使用\u003c/span>\u003c/div>';\n    const runWidth = row.run / row.capacity * 100;\n    const otherWidth = row.other / row.capacity * 100;\n    const idleWidth = Math.max(0, 100 - runWidth - otherWidth);\n    return `\u003cdiv class=\"usage-stack\" title=\"Run ${formatMinutes(row.run)} · 其他 ${formatMinutes(row.other)} · Idle ${formatMinutes(row.idle)}\">\u003ci class=\"run\" style=\"width:${runWidth}%\">\u003c/i>\u003ci class=\"other\" style=\"width:${otherWidth}%\">\u003c/i>\u003ci class=\"idle\" style=\"width:${idleWidth}%\">\u003c/i>\u003c/div>\u003cspan class=\"usage-share\">本部门占机 ${row.share}%\u003c/span>`;\n  }\n\n  document.getElementById('department-usage').innerHTML = departmentRows.map(row => `\u003cbutton type=\"button\" class=\"department-usage-row\" data-department=\"${row.name}\">\n    \u003cspan class=\"department-name\">\u003cstrong>${row.name}\u003c/strong>\u003csmall>${row.machines.length} 台机台 · ${row.tasks.length} 个工单\u003c/small>\u003c/span>\n    \u003cspan>${usageStack(row)}\u003c/span>\n    \u003cb class=\"usage-value run\">${formatMinutes(row.run)}\u003c/b>\n    \u003cb class=\"usage-value other\">${formatMinutes(row.other)}\u003c/b>\n    \u003cb class=\"usage-value idle\">${formatMinutes(row.idle)}\u003c/b>\n    \u003cspan class=\"usage-people\">${row.people.length} 人\u003c/span>\n    \u003cspan class=\"usage-open\">明细 ›\u003c/span>\n  \u003c/button>`).join('');\n\n  function personRows(row) {\n    const people = new Map();\n    row.tasks.forEach(task => {\n      if (!people.has(task.pe)) people.set(task.pe, { name: task.pe, minutes: 0, tasks: 0, machines: new Set() });\n      const person = people.get(task.pe);\n      person.minutes += taskMinutes(task);\n      person.tasks += 1;\n      person.machines.add(task.machine);\n    });\n    return [...people.values()].sort((a, b) => b.minutes - a.minutes);\n  }\n\n  function detailStack(machineRow) {\n    const runWidth = machineRow.run / DAY_MINUTES * 100;\n    const otherWidth = machineRow.other / DAY_MINUTES * 100;\n    const idleWidth = Math.max(0, 100 - runWidth - otherWidth);\n    return `\u003cdiv class=\"usage-stack\">\u003ci class=\"run\" style=\"width:${runWidth}%\">\u003c/i>\u003ci class=\"other\" style=\"width:${otherWidth}%\">\u003c/i>\u003ci class=\"idle\" style=\"width:${idleWidth}%\">\u003c/i>\u003c/div>`;\n  }\n\n  function openDepartment(departmentName) {\n    const row = departmentRows.find(item => item.name === departmentName);\n    const people = personRows(row);\n    const machineDetails = row.machines.length ? row.machines.map(machineRow => `\u003csection class=\"analytics-machine-row\">\n      \u003cdiv class=\"analytics-machine-head\">\u003cdiv>\u003cstrong>${machineRow.machine.name}\u003c/strong>\u003cspan>${machineRow.machine.type} · ${machineRow.machine.lab}\u003c/span>\u003c/div>\u003ca href=\"machines.html?group=dept\">查看机台\u003c/a>\u003c/div>\n      ${detailStack(machineRow)}\n      \u003cdiv class=\"analytics-machine-metrics\">\u003cspan>\u003ci class=\"run\">\u003c/i>本部门 Run \u003cb>${formatMinutes(machineRow.run)}\u003c/b>\u003c/span>\u003cspan>\u003ci class=\"other\">\u003c/i>其他部门 \u003cb>${formatMinutes(machineRow.other)}\u003c/b>\u003c/span>\u003cspan>\u003ci class=\"idle\">\u003c/i>Idle \u003cb>${formatMinutes(machineRow.idle)}\u003c/b>\u003c/span>\u003c/div>\n    \u003c/section>`).join('') : '\u003cdiv class=\"empty\">今日暂无机台使用记录\u003c/div>';\n    const peopleDetails = people.length ? people.map(person => `\u003cdiv class=\"analytics-person-row\">\u003cspan class=\"avatar\">${person.name.slice(0, 1)}\u003c/span>\u003cdiv>\u003cstrong>${person.name}\u003c/strong>\u003csmall>${person.tasks} 个工单 · ${person.machines.size} 台机台\u003c/small>\u003c/div>\u003cb>${formatMinutes(person.minutes)}\u003c/b>\u003c/div>`).join('') : '\u003cdiv class=\"muted\">暂无使用人\u003c/div>';\n    const taskDetails = row.tasks.length ? row.tasks.sort((a, b) => a.start - b.start).map(task => {\n      const machine = Store.machine(task.machine);\n      return `\u003cbutton type=\"button\" class=\"analytics-task-row\" data-task=\"${task.id}\">\u003cspan>\u003cstrong>${task.id} · ${task.product}\u003c/strong>\u003csmall>${task.pe} · ${machine ? machine.name : '待分配'}\u003c/small>\u003c/span>\u003cspan>${Store.minToClock(task.start)}–${Store.minToClock(task.end)}\u003c/span>\u003cb>${formatMinutes(taskMinutes(task))}\u003c/b>\u003c/button>`;\n    }).join('') : '\u003cdiv class=\"muted\">暂无工单\u003c/div>';\n\n    V2App.openDrawer(`\u003cdiv class=\"drawer-head\">\u003cdiv>\u003ch2>${row.name}\u003c/h2>\u003cdiv class=\"muted\">今日机台使用下钻\u003c/div>\u003c/div>\u003cbutton class=\"icon-btn\" data-close-drawer>${V2App.I.close}\u003c/button>\u003c/div>\n      \u003cdiv class=\"drawer-body\">\n        \u003cdiv class=\"analytics-drawer-summary\">\u003cdiv>\u003cspan>Run\u003c/span>\u003cstrong>${formatMinutes(row.run)}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>Idle\u003c/span>\u003cstrong>${formatMinutes(row.idle)}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>使用人\u003c/span>\u003cstrong>${row.people.length}\u003c/strong>\u003c/div>\u003c/div>\n        \u003ch3 class=\"section-title\">按机台\u003c/h3>${machineDetails}\n        \u003ch3 class=\"section-title\">使用人\u003c/h3>\u003cdiv class=\"analytics-person-list\">${peopleDetails}\u003c/div>\n        \u003ch3 class=\"section-title\">工单明细\u003c/h3>\u003cdiv class=\"analytics-task-list\">${taskDetails}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"drawer-foot\">\u003cbutton class=\"btn\" data-close-drawer>关闭\u003c/button>\u003ca class=\"btn primary\" href=\"index.html\">查看完整排程\u003c/a>\u003c/div>`);\n    document.querySelectorAll('[data-task]').forEach(button => button.addEventListener('click', () => V2App.taskDrawer(Store.task(button.dataset.task))));\n  }\n\n  document.querySelectorAll('[data-department]').forEach(button => button.addEventListener('click', () => openDepartment(button.dataset.department)));\n\n  document.getElementById('machine-bars').innerHTML = machines.map(machine => {\n    const minutes = placedTasks.filter(task => task.machine === machine.id).reduce((total, task) => total + taskMinutes(task), 0);\n    const percent = Math.round(minutes / DAY_MINUTES * 100);\n    return `\u003cdiv class=\"bar-row\">\u003cspan>${machine.name}\u003c/span>\u003cdiv class=\"bar-track\">\u003ci style=\"width:${percent}%\">\u003c/i>\u003c/div>\u003cb>${percent}%\u003c/b>\u003c/div>`;\n  }).join('');\n\n  const statuses = ['scheduled', 'running', 'done', 'pending', 'hold', 'fail'];\n  const statusMax = Math.max(...statuses.map(status => tasks.filter(task => task.status === status).length), 1);\n  document.getElementById('status-bars').innerHTML = statuses.map(status => {\n    const count = tasks.filter(task => task.status === status).length;\n    return `\u003cdiv class=\"bar-row\">\u003cspan>${Store.STATUS_META[status].label}\u003c/span>\u003cdiv class=\"bar-track\">\u003ci style=\"width:${count / statusMax * 100}%\">\u003c/i>\u003c/div>\u003cb>${count}\u003c/b>\u003c/div>`;\n  }).join('');\n\n  document.getElementById('quota-bars').innerHTML = Store.departments.map(department => {\n    const used = Store.quotaUsedMin(department.name, 0);\n    const percent = Math.round(used / department.dailyQuotaMin * 100);\n    return `\u003cdiv class=\"bar-row\">\u003cspan>${department.name}\u003c/span>\u003cdiv class=\"bar-track\">\u003ci style=\"width:${Math.min(100, percent)}%\">\u003c/i>\u003c/div>\u003cb>${percent}%\u003c/b>\u003c/div>`;\n  }).join('');\n\n  document.getElementById('guard').innerHTML = '\u003cdiv class=\"grid-2\">\u003cdiv class=\"notice\">\u003cb>签到护栏 · 已开启\u003c/b>\u003cdiv>超时未签到自动释放\u003c/div>\u003c/div>\u003cdiv class=\"notice\">\u003cb>配额封顶 · 已开启\u003c/b>\u003cdiv>仅工作日白班累计\u003c/div>\u003c/div>\u003cdiv class=\"notice\">\u003cb>候补补位 · 已开启\u003c/b>\u003cdiv>空窗释放后自动顺延\u003c/div>\u003c/div>\u003cdiv class=\"notice\">\u003cb>预约提前量 · T~T+3\u003c/b>\u003cdiv>限制长期预占资源\u003c/div>\u0  sheet row, e.g. rowId('BR', rules) → 'BR-5'\n  function rowId(prefix, arr) {\n    let n = 0;\n    arr.forEach(r => { const m = /(\\d+)$/.exec(r.id || ''); if (m) n = Math.max(n, +m[1]); });\n    return prefix + '-' + (n + 1);\n  }\n\n  let state = load();\n\n  // ---- helpers ----\n  function minToClock(offset) {\n    if (offset == null) return '—';\n    let total = 480 + offset;\n    const h = Math.floor(total / 60) % 24;\n    const m = total % 60;\n    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');\n  }\n  function fmtDur(min) {\n    if (min == null) return '—';\n    const h = Math.floor(min / 60), m = min % 60;\n    return (h ? h + 'h' : '') + (m ? m + 'min' : (h ? '' : '0min'));\n  }\n  // date label for a day-offset relative to the simulated \"today\" (state.today)\n  function dateLabel(offset) {\n    const base = new Date(state.today + 'T00:00:00');\n    const d = new Date(base.getTime() + offset * 86400000);\n    const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];\n    const text = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n    return { text, wd, isToday: offset === 0 };\n  }\n  function dayName(offset) {\n    return offset === 0 ? '今天' : offset === 1 ? '明天' : offset === -1 ? '昨天'\n         : (offset > 0 ? '+' + offset + '天' : offset + '天');\n  }\n\n  const STATUS_META = {\n    pending:   { label: '待排程',  cls: 'neutral' },\n    scheduled: { label: '已排程',  cls: 'info' },\n    running:   { label: '测试中',  cls: 'running' },\n    done:      { label: '已完成',  cls: 'ok' },\n    hold:      { label: '已挂起',  cls: 'warn' },\n    fail:      { label: '测试异常', cls: 'danger' },\n  };\n  const MACHINE_STATUS = {\n    idle:        { label: '空闲',   cls: 'ok',      schedulable: true  },\n    running:     { label: '运行中', cls: 'running', schedulable: true  },\n    maintenance: { label: '保养中', cls: 'warn',    schedulable: false },\n    fault:       { label: '故障',   cls: 'danger',  schedulable: false },\n  };\n  const PRIO_META = {\n    high: { label: '高', cls: 'p-high', rank: 0 },\n    mid:  { label: '中', cls: 'p-mid',  rank: 1 },\n    low:  { label: '低', cls: 'p-low',  rank: 2 },\n  };\n\n  const Store = {\n    get state() { return state; },\n    get machines() { return state.machines; },\n    get tasks() { return state.tasks; },\n    nowMin: () => state.nowMin,\n    today: () => state.today,\n\n    machine(id) { return state.machines.find(m => m.id === id); },\n    task(id) { return state.tasks.find(t => t.id === id); },\n    tasksByShift(shift) { return state.tasks.filter(t => t.shift === shift); },\n    schedulableMachines() { return state.machines.filter(m => MACHINE_STATUS[m.status].schedulable); },\n\n    setMachineStatus(id, status, note) {\n      const m = this.machine(id);\n      if (!m) return;\n      m.status = status;\n      if (note != null) m.note = note;\n      save(state);\n    },\n    setTaskStatus(id, status, note) {\n      const t = this.task(id);\n      if (!t) return;\n      t.status = status;\n      if (note != null) t.note = note;\n      save(state);\n    },\n    setTaskMachine(id, machine) {\n      const t = this.task(id);\n      if (!t) return;\n      t.machine = machine;\n      t.moved = true;\n      save(state);\n    },\n    setTaskPrio(id, prio) {\n      const t = this.task(id);\n      if (!t) return;\n      t.prio = prio;\n      save(state);\n    },\n    addTask(t) {\n      state.tasks.push(t);\n      save(state);\n    },\n    updateTask(id, fields) {\n      const t = this.task(id);\n      if (!t) return;\n      Object.assign(t, fields);\n      save(state);\n    },\n    removeTask(id) {\n      const i = state.tasks.findIndex(t => t.id === id);\n      if (i >= 0) state.tasks.splice(i, 1);\n      save(state);\n    },\n    // 智能排测算法（原型）：清空原占位，按班次/当天找最早空档重新分配。\n    // 工程师无法指定机台或时间 —— 每次编辑都会重排，从机制上杜绝提前占位。\n    autoSchedule(id) {\n      const t = this.task(id);\n      if (!t) return null;\n      const day = t.day || 0;\n
