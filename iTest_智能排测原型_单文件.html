  }

  window.addEventListener('message',function(event){
    if(event.source!==frame.contentWindow||!event.data)return;
    if(event.data.type==='itest:navigate')navigate(event.data.href,false);
    if(event.data.type==='itest:reload')render(currentRoute);
    if(event.data.type==='itest:download'){
      var blob=new Blob([event.data.content],{type:event.data.mime});
      var url=URL.createObjectURL(blob);
      var anchor=document.createElement('a');
      anchor.href=url;
      anchor.download=event.data.name;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
    }
  });
  window.addEventListener('popstate',function(){render(location.hash)});
  frame.addEventListener('load',function(){loading.style.display='none'});

  if(!location.hash)navigate('index.html',true);else render(location.hash);
})();
</script>
</body>
</html>
