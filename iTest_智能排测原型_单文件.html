  var bytes=Uint8Array.from(raw,function(char){return char.charCodeAt(0)});
  var bundle=JSON.parse(new TextDecoder().decode(bytes));
  var frame=document.getElementById('prototype');
  var loading=document.getElementById('loading');
  var allowed=Object.keys(bundle.pages);
  var currentRoute='index.html';

  function parseRoute(value){
    var route=(value||'').replace(/^#/,'');
    if(!route)return {page:'index.html',search:''};
    var split=route.indexOf('?');
    var page=split>=0?route.slice(0,split):route;
    var search=split>=0?route.slice(split):'';
    return {page:allowed.indexOf(page)>=0?page:'index.html',search:search};
  }

  function bridge(search){
    return '<script>(function(){'+
      'window.__itestSearch='+JSON.stringify(search)+';'+
      'window.__itestNavigate=function(href){parent.postMessage({type:"itest:navigate",href:String(href)},"*")};'+
      'window.__itestReload=function(){parent.postMessage({type:"itest:reload"},"*")};'+
      'window.__itestDownload=function(name,content,mime){parent.postMessage({type:"itest:download",name:String(name),content:String(content),mime:String(mime||"application/octet-stream")},"*")};'+
      'document.addEventListener("click",function(event){var link=event.target.closest("a[href]");if(!link)return;var href=link.getAttribute("href");if(/^(index|create|machines|analytics|settings)\.html(?:[?#].*)?$/.test(href)){event.preventDefault();window.__itestNavigate(href)}},true);'+
    '})()<\/script>';
  }

  function materialize(page,search){
    var html=bundle.pages[page];
    html=html.replace(/<link[^>]+href=["']assets\/styles\.css["'][^>]*>/i,'<style>'+bundle.assets.styles+'</style>');
    html=html.replace(/<link[^>]+href=["']assets\/create-showcase\.css["'][^>]*>/i,'<style>'+bundle.assets.createStyles+'</style>');
    html=html.replace(/<script[^>]+src=["']..\/assets\/data\.js["'][^>]*><\/script>/i,'<script>'+bundle.assets.data+'<\/script>');
    html=html.replace(/<script[^>]+src=["']assets\/app\.js["'][^>]*><\/script>/i,'<script>'+bundle.assets.app+'<\/script>');
    html=html.replace(/<script[^>]+src=["']assets\/create-showcase\.js["'][^>]*><\/script>/i,'<script>'+bundle.assets.create+'<\/script>');
    return html.replace(/<head([^>]*)>/i,'<head$1>'+bridge(search));
  }

  function render(route){
    var parsed=parseRoute(route);
    currentRoute=parsed.page+parsed.search;
    document.title=(parsed.page==='index.html'?'排测中心':parsed.page==='create.html'?'新建工单':parsed.page==='machines.html'?'机台':parsed.page==='analytics.html'?'数据分析':'设置')+' · iTest 智能排测';
    frame.srcdoc=materialize(parsed.page,parsed.search);
  }

  function navigate(href,replace){
    var route=String(href||'index.html').replace(/^\.\//,'');
    if(allowed.indexOf(route.split(/[?#]/)[0])<0)route='index.html';
    var next='#'+route;
    if(replace)history.replaceState(null,'',next);else if(location.hash!==next)history.pushState(null,'',next);
    render(route);
  }

  window.addEventListener('message',function(event){
    if(event.source!==frame.contentWindow||!event.data)return;
    if(event.data.type==='itest:navigate')navigate(event.data.href,false);
    if(event.data.type==='itest:reload')render(currentRoute);
    if(event.data.type==='itest:download'){
      var blob=new Blob([event.data.content],{type:event.data.mime});
      var url=URL.createObjectURL(blob);
      var anchor=document.createElement('a');
      anchor.href=url;
      anchor.download=event.data.name;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
    }
  });
  window.addEventListener('popstate',function(){render(location.hash)});
  frame.addEventListener('load',function(){loading.style.display='none'});

  if(!location.hash)navigate('index.html',true);else render(location.hash);
})();
